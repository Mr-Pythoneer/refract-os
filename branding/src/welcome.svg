<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 460">
  <!-- Calamares welcome banner — the first thing anyone sees of Refract OS.

       LOGO-FREE by request. This previously drew the prism mark at banner scale
       (beam entering, five rays leaving). All of it is gone: the OS now ships no
       Refract mark anywhere, in any surface, and branding is the product NAME as
       text only. The mode chips stay because they are a functional legend for
       the five modes, not a logo — each is just the mode's colour beside its
       name, and the same five hexes are used by the wallpapers, the mode cards
       on the website and distro-modectl's per-mode ACCENT.

       Background matches the wallpapers' near-black so installer, desktop and
       login still read as one system without a mark tying them together. -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0e1016"/>
      <stop offset="100%" stop-color="#060709"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="460" fill="url(#bg)"/>

  <!-- Wordmark. Inter is the OS's own UI font; the fallbacks are what a macOS
       build host will actually rasterize with (see branding/build.sh). -->
  <text x="72" y="200" font-family="Inter, SF Pro Display, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="66" font-weight="700" fill="#f2f3f5" letter-spacing="-2">Refract OS</text>
  <text x="74" y="240" font-family="Inter, SF Pro Display, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="21" fill="#9297a0">One install. Five modes. Local-first AI.</text>

  <!-- Mode legend: colour swatch + name, in dispersion order. -->
  <g font-family="Inter, SF Pro Display, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#6c717a">
    <rect x="74" y="286" width="10" height="10" rx="2.5" fill="#ff5a52"/>
    <text x="92" y="295.5">Gaming</text>
    <rect x="74" y="310" width="10" height="10" rx="2.5" fill="#ffa23d"/>
    <text x="92" y="319.5">Normal</text>
    <rect x="74" y="334" width="10" height="10" rx="2.5" fill="#7bc043"/>
    <text x="92" y="343.5">Server</text>
    <rect x="216" y="286" width="10" height="10" rx="2.5" fill="#4a9df0"/>
    <text x="234" y="295.5">AI</text>
    <rect x="216" y="310" width="10" height="10" rx="2.5" fill="#e857a0"/>
    <text x="234" y="319.5">Creative</text>
  </g>
</svg>
