# Calamares top-level settings. Format/keys per Calamares' documented
# schema (calamares.io/docs) — NOT verified against a running Calamares
# instance, see iso/calamares/README.md.

# 'local' is Calamares' own module directory. The second entry is ours:
# build.sh rsyncs iso/calamares/ -> /etc/calamares/, so
# iso/calamares/custom-modules/refractselections/ ships as
# /etc/calamares/custom-modules/refractselections/ and is found here. It holds
# the python job that persists the two packagechooser selections — see that
# module's header for why shellprocess could not do it.
modules-search: [ local, /etc/calamares/custom-modules ]

# Named instances are used ONLY for the two mode-selection modules, so that the
# packagechooser writes GlobalStorage key `packagechooser_modes` and each loads
# its own modules/<name>_modes.conf (see docs/mode-selection-design.md §3.1).
# Every other module (unpackfs etc.) deliberately keeps its DEFAULT instance and
# is referenced bare in the sequence — a named `instances:` entry only applies
# to an `<module>@<id>` sequence entry, so the previous rootfs instance here was
# dead config: its unpackfs.conf override never took effect and, worse, no
# modules/unpackfs.conf existed at all, which aborted the install.
#
# The two shellprocess instances that used to live here (@layout and @modes) are
# GONE, and could never have worked: they referenced ${gs[packagechooser_*]},
# which shellprocess does not implement — its expander knows only ROOT, USER and
# LANG, so the job aborted the install with "Missing variables are:
# gs[packagechooser_layout]" AFTER unpackfs had written the filesystem. Both are
# replaced by the single `refractselections` python job in exec: below, which
# reads GlobalStorage directly.
instances:
- { id: layout, module: packagechooser, config: packagechooser_layout.conf }
- { id: modes, module: packagechooser, config: packagechooser_modes.conf }
# Strips the installer off the installed system — see the config's header.
- { id: cleanup, module: shellprocess, config: shellprocess_cleanup.conf }
# Removes the LIVE boot system (casper) from the installed target and rebuilds
# its initramfs. Must run BEFORE grubcfg — see the config's header.
- { id: decasper, module: shellprocess, config: shellprocess_decasper.conf }
# Guard between mount and unpackfs — see modules/shellprocess_verifyroot.conf.
- { id: verifyroot, module: shellprocess, config: shellprocess_verifyroot.conf }

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - packagechooser@layout
  - packagechooser@modes
  - summary
- exec:
  - partition
  - mount
  # Refuses to continue if the target root did not actually mount. Without
  # this, unpackfs silently rsyncs the whole squashfs into the live RAM
  # overlay and dies with an opaque rsync error 10/11.
  - shellprocess@verifyroot
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  # refractselections persists BOTH packagechooser answers (the Look page and the
  # Modes page). It must stay AFTER unpackfs — it needs /opt/distro to exist in
  # the target — and after users, so any future per-user work sees the created
  # account. Still before umount, so it runs inside the mounted target.
  #
  # It replaces shellprocess@layout + shellprocess@modes, which were not merely
  # buggy but impossible: shellprocess has no gs[...] expansion, so both aborted
  # the install after the filesystem was already written. See the module header.
  - refractselections
  - displaymanager
  - networkcfg
  - hwclock
  # decasper MUST precede grubcfg: grub-mkconfig reads /etc/default/grub, so the
  # casper args have to be gone before the kernel cmdline is baked into grub.cfg.
  - shellprocess@decasper
  - grubcfg
  - bootloader
  - shellprocess@cleanup
  - umount
- show:
  - finished

branding: refractos

prompt-install: true
dont-chroot: false
