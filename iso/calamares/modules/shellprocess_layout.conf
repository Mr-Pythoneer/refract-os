# Persist the packagechooser@layout choice into the installed system.
#
# dontChroot: false -> runs INSIDE the installed target, so /opt/distro and
# /etc/refract are target-native paths.
#
# ${gs[...]} braces are LOAD-BEARING — a bare gs[key] is passed through as a
# literal string and silently discards the user's choice. That exact bug hit
# shellprocess_modes.conf; see its comments.
#
# Writes /etc/refract/layout only. It does NOT run gsettings: at install time
# there is no user session on the target to write dconf into. The layout is
# applied on first login by the profile snippet build.sh stages into /etc/skel.
# THE VALUE CAN LEGITIMATELY BE EMPTY. packagechooser_layout.conf is mode:
# optional, because Refract is the DEFAULT look and a default you cannot skip
# past is not a default. So a user who presses Next without picking writes the
# empty string here — and the previous version of this line dutifully wrote a
# blank /etc/refract/layout, which distro-layoutctl reads as an unknown layout.
#
# The case statement substitutes 'refract' for empty AND for anything not in the
# known set, so a future typo'd or removed id degrades to a working desktop
# instead of a broken one. Whitelisting rather than defaulting-on-empty is
# deliberate: this string is interpolated straight into a shell command running
# as root on the target, so the only values that reach the filesystem are the
# four we shipped.
dontChroot: false
timeout: 60
script:
  - command: "/bin/sh -c 'mkdir -p /etc/refract; case \"${gs[packagechooser_layout]}\" in refract|classic|macos|minimal) printf \"%s\\n\" \"${gs[packagechooser_layout]}\" ;; *) printf \"refract\\n\" ;; esac > /etc/refract/layout'"
    timeout: 60
