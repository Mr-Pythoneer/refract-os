# Persist the packagechooser@layout choice into the installed system.
#
# dontChroot: false -> runs INSIDE the installed target, so /opt/distro and
# /etc/refract are target-native paths.
#
# ${gs[...]} braces are LOAD-BEARING — a bare gs[key] is passed through as a
# literal string and silently discards the user's choice. That exact bug hit
# shellprocess_modes.conf; see its comments.
#
# Writes /etc/refract/layout only. It does NOT run gsettings: at install time
# there is no user session on the target to write dconf into. The layout is
# applied on first login by the profile snippet build.sh stages into /etc/skel.
dontChroot: false
timeout: 60
script:
  - command: "/bin/sh -c 'mkdir -p /etc/refract && printf \"%s\\n\" \"${gs[packagechooser_layout]}\" > /etc/refract/layout'"
    timeout: 60
