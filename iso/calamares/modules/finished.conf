# The last page of the installer — and the moment a first-time user is most
# likely to get lost.
#
# Without this file Calamares uses its own default, restartNowMode:
# user-unchecked: the restart box is shown UNTICKED. So the natural path is
# "install finishes -> click Done -> nothing happens -> still sitting in the live
# session". The person then keeps using the USB desktop, possibly for a long
# time, wondering why nothing they do survives a reboot — or reboots, leaves the
# stick in, and boots the installer all over again. That was reported from a real
# install (2026-08-16) and it is a completely avoidable dead end.
#
# user-checked: the box is shown ALREADY TICKED, so pressing Done restarts the
# machine, and the live medium's own shutdown hook then prompts to remove the USB
# stick before it powers down.
#
# DELIBERATELY NOT `always`. That mode ticks the box and forbids unticking it —
# and this same page is where a FAILED install lands. Forcing a reboot there
# would destroy /root/.cache/calamares/session.log, which is the only thing that
# has ever explained an installation failure in this project, before anyone could
# read it. Every install failure on real hardware so far was diagnosed from that
# file. It stays reachable.
#
# Someone who wants to look around the live session first can still untick it.
---
restartNowMode: user-checked

# `systemctl -i reboot`: -i ignores inhibitors. Without it a stray session lock
# can silently refuse the reboot, which looks exactly like the button not working.
restartNowCommand: "systemctl -i reboot"

# The desktop notification needs Calamares to reach the user's session bus. It
# runs under pkexec as root, which does not, so this would be a no-op that only
# ever produced a warning in the log.
notifyOnFinished: false
