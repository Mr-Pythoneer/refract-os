# The "what is this machine for?" page — as real CHECKBOXES.
#
# WHY THIS IS NOT packagechooser. It used to be, with mode: optionalmultiple,
# and picking more than one mode was possible but effectively invisible: that
# widget is a plain QListView and multi-select means Ctrl/Cmd-click. Verified in
# upstream source rather than guessed — PackageChooserPage.cpp:38-43 sets only
# SingleSelection or ExtendedSelection, and PackageModel exposes no check-state
# role, so packagechooser CANNOT draw a checkbox at any setting. A list that
# looks single-select IS single-select to everyone who has not been told
# otherwise, and "hold Ctrl" is not a thing a normal person should have to know
# to install an operating system.
#
# netinstall is the one stock Calamares module with real checkboxes, so the page
# is built from it instead.
#
# NOTHING HERE IS APT-INSTALLED, and that is deliberate. netinstall's normal job
# is to feed the *packages* module, which installs what was ticked — but
# settings.conf has NO packages module anywhere in exec, so the names below are
# never handed to apt. They are SENTINELS: netinstall records the ticked ones in
# GlobalStorage under `packageOperations`, and refractselections reads them back
# and maps refract-mode-<id> to a mode id. Refract's modes are on-demand setup
# scripts under modes/<mode>/setup/, not packages, so capturing the choice is the
# whole requirement.
#
# THE CONSEQUENCE, WRITTEN DOWN BECAUSE IT WOULD BE UGLY: if a packages module is
# ever added to the exec sequence, apt will be asked to install four packages
# that do not exist and the install will fail at the end. install-smoke asserts
# no packages module is present for exactly this reason.
#
# groupsUrl: local -> the groups are read from THIS file, so there is no second
# file to keep in sync and no network fetch during an offline install.
---
groupsUrl: local
required: false

label:
    sidebar: "Modes"
    title: "What is this machine for?"

groups:
  - name: "Normal"
    description: "A balanced desktop that is good at everything — browsing, office, media, light coding. This is the base system and is always installed."
    selected: true
    packages:
      - refract-mode-normal
  # @item:gaming
  - name: "Gaming"
    description: "Steam/Proton, Lutris, gamemode and MangoHud."
    selected: false
    packages:
      - refract-mode-gaming
  # @enditem:gaming
  # @item:ai
  - name: "AI"
    description: "Local-first LLMs (Ollama) and ComfyUI image generation. No cloud assistant required."
    selected: false
    packages:
      - refract-mode-ai
  # @enditem:ai
  # @item:server
  - name: "Server"
    description: "SSH, Docker and Netdata monitoring — headless-friendly services."
    selected: false
    packages:
      - refract-mode-server
  # @enditem:server
  # @item:creative
  - name: "Creative"
    description: "FreeCAD, Blender, Kdenlive, DaVinci Resolve and ffmpeg — 3D, video and design tools."
    selected: false
    packages:
      - refract-mode-creative
  # @enditem:creative
