# Fail LOUDLY and INSTANTLY if the target root is not really mounted.
#
# THE BUG THIS CATCHES. Calamares' mount module only WARNS when mounting the
# target filesystem fails — it logs "Cannot mount ..." and carries on, and it
# still publishes rootMountPoint, which is just a bare tempfile.mkdtemp()
# directory on the LIVE system. unpackfs then checks only that the destination
# path exists (it does — mkdtemp created it) and rsyncs the entire squashfs into
# it. That directory lives on casper's RAM-backed writable overlay, so the copy
# fills the machine's memory instead of the disk, and rsync dies partway with
# ENOSPC. The user is shown only:
#
#     Failed to unpack image "/cdrom/casper/filesystem.squashfs"
#     details: rsync failed with error code 10.
#
# which names neither the mount nor the memory. The exit code alternated between
# 10 and 11 across identical runs precisely because it is a race between rsync's
# sender and receiver processes dying — a deterministic config error could not
# produce that.
#
# dontChroot is REQUIRED: ${ROOT} only expands to rootMountPoint for jobs that
# are NOT run inside the target. Verified against libcalamares CommandList.cpp,
# which also confirms every command is wrapped in /bin/sh -c and that a non-zero
# exit aborts the install with the message below.
dontChroot: true
timeout: 60
script:
    - "/bin/sh -c 'mountpoint -q \"${ROOT}\" || { echo \"FATAL: ${ROOT} is not a mount point — the target filesystem never mounted. Installing now would copy the system into RAM, not onto the disk.\"; exit 1; }'"
    - "/bin/sh -c 'test -w \"${ROOT}\" || { echo \"FATAL: ${ROOT} is not writable.\"; exit 1; }'"
    - "/bin/sh -c 'echo \"verifyroot: ${ROOT} is a real, writable mount — safe to unpack.\"; df -h \"${ROOT}\"'"
