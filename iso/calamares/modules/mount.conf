# Calamares `mount` module — extra filesystems bind/mounted into the TARGET before
# any chrooted module runs.
#
# THIS FILE WAS MISSING and its absence was silent, which is the worst kind.
# settings.conf's exec sequence names `mount`, but no config shipped and nothing
# generated one; noble's `calamares` package ships no /usr/share/calamares/modules
# defaults either. The module's main.py does:
#     extra_mounts = libcalamares.job.configuration.get("extraMounts") or []
#     ... libcalamares.utils.warning("No extra mounts defined. Does mount.conf exist?")
# i.e. it WARNS and continues. So /proc, /sys, /dev, /run and efivars were never
# mounted in the target, and every later chrooted job (machineid, fstab, locale,
# users, displaymanager, grubcfg, bootloader) ran in a bare chroot. That is the
# kind of failure that produces a "successful" install which then will not boot.
#
# Values are upstream Calamares' own defaults, taken verbatim from
# src/modules/mount/mount.conf so the semantics match what the module expects.
---
extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc
    - device: sys
      fs: sysfs
      mountPoint: /sys
    - device: /dev
      mountPoint: /dev
      options: [ bind ]
    - device: tmpfs
      fs: tmpfs
      mountPoint: /run
    - device: /run/udev
      mountPoint: /run/udev
      options: [ bind ]
    # efi: true -> only mounted for UEFI installs. Required for efibootmgr to be
    # able to write a boot entry from inside the chroot; the X1 Carbon target is
    # UEFI-only, so without this the bootloader module cannot register Refract.
    - device: efivarfs
      fs: efivarfs
      mountPoint: /sys/firmware/efi/efivars
      efi: true

# Only consulted when the user picks btrfs in the partition module (which
# partition.conf allows). Without these the install lands subvolume-less.
btrfsSubvolumes:
    - mountPoint: /
      subvolume: /@
    - mountPoint: /home
      subvolume: /@home
    - mountPoint: /var/cache
      subvolume: /@cache
    - mountPoint: /var/log
      subvolume: /@log

btrfsSwapSubvol: /@swap

mountOptions:
    - filesystem: default
      options: [ defaults ]
    - filesystem: efi
      options: [ defaults, umask=0077 ]
    - filesystem: btrfs
      options: [ defaults, compress=zstd:1 ]
    - filesystem: btrfs_swap
      options: [ defaults, noatime ]
