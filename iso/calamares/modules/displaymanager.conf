# Calamares `displaymanager` module — configures the target's login manager and,
# when the user ticked "log in automatically", its autologin.
#
# THIS FILE WAS MISSING and it is a HARD install-blocker, not a silent one. The
# module's main.py ends with:
#     return ("No display managers selected for the displaymanager module.",
#             "The displaymanagers list is empty or undefined in both globalstorage
#              and displaymanager.conf.")
# A returned error tuple aborts the install. Nothing in this repo sets the
# globalstorage `displayManagers` key either (grep: the only hit for
# "displaymanager" anywhere was the settings.conf sequence entry itself), so the
# install died here every time — which is consistent with Calamares never having
# completed an install on real hardware.
---
# gdm is what the desktop strains actually ship and what the image configures:
# iso/config/hooks/0400-polish.chroot writes /etc/gdm3/custom.conf (WaylandEnable,
# session bits) and iso/build.sh's autologin block targets gdm too.
#
# NOTE for the lowspec strain: it installs lubuntu-desktop, which pulls SDDM, not
# gdm. This list is "ordered, best effort" — Calamares configures the first entry
# it finds installed — so listing sddm after gdm makes one config correct for
# both branches instead of needing a per-strain file.
displaymanagers:
    - gdm
    - sddm

# false: the DM's user/group and /var directories are already created by the
# Ubuntu packages (gdm3 / sddm). Setting true makes Calamares try to do the
# distro packaging's job and is only for distros that do not.
basicSetup: false

# openSUSE-specific sysconfig autologin path. Not applicable to an Ubuntu base.
sysconfigSetup: false
