# Calamares partition module config.
#
# Corrected against the real upstream schema (calamares/calamares,
# src/modules/partition/partition.conf, verified 2026-06). The earlier draft
# had two genuine schema errors — `efi.systemPartition` (should be the `efi:`
# map with `mountPoint`) and `userSwapChoices` wrongly nested under `efi`
# (it's top-level). Still unverified against an actual Calamares RUN — that
# needs a Linux host with the calamares package — but the keys/types/values
# below now match upstream, not a guess.

# EFI System Partition (replaces the old efiSystemPartition* flat keys).
efi:
  mountPoint:      "/boot/efi"
  recommendedSize: 300MiB
  minimumSize:     32MiB
  label:           "EFI"

# Default + offered filesystems for new/erased partitions.
defaultFileSystemType: "ext4"
availableFileSystemTypes:
  - ext4
  - btrfs

# Swap options offered to the user (TOP-LEVEL list), and which is preselected.
# initialSwapChoice must be one of these members.
userSwapChoices:
  - none
  - small
  - file
initialSwapChoice: file

# Initial automated-partitioning radio: none|erase|replace|alongside|manual.
# `none` = no radio pre-selected, so the user must consciously pick a scheme.
# Was `erase`, which pre-selected wipe-the-whole-disk — a dual-boot footgun on
# any machine that already has an OS. The schema explicitly allows `none`
# (it's the first documented value above), so this forces an explicit choice
# rather than defaulting to destructive.
initialPartitioningChoice: none
allowManualPartitioning: true

# Encryption generation (luks1|luks2). luks1 is the safe default — not all
# GRUB builds boot LUKS2/argon2id.
luksGeneration: luks1

# Whether to offer LVM-on-LUKS automated layouts.
lvm:
  enable: false

# Minimum disk size to install, in GiB (the welcome module's value, if set,
# takes precedence; this is the fallback).
requiredStorage: 5.5

# Partition-preview rendering.
drawNestedPartitions: false
alwaysShowPartitionLabels: true

# --- REQUIRED WORKAROUND, DO NOT DELETE -------------------------------------
# THIS IS WHY NO INSTALL EVER WORKED. Ubuntu's calamares 3.3.5-0ubuntu4 carries
# a distro-only patch, enable-only-present-with-encryption-partitions.patch,
# which declares in PartitionLayout.h:
#     bool partOnlyPresentWithEncryption;      // note: NO "= false"
# unlike partNoEncrypt directly above it, which does have one. The patch then
# reads that member in FOUR guards inside PartitionLayout::createPartitions():
#     if ( luksPassphrase.isEmpty() && entry.partOnlyPresentWithEncryption ) continue;
# and only ever ASSIGNS it on the config-driven path, via
#     Calamares::getBool( pentry, "onlyPresentWithEncryption", false )
#
# With no partitionLayout key, PartitionLayout::init() takes its fallback:
#     addEntry( { FileSystem::Type::Unknown, "/", "100%" } );
# That braced-init selects a 5-argument constructor the patch never updated, so
# the new member is default-initialised — indeterminate. On an unencrypted
# install the first conjunct is true, the indeterminate byte reads nonzero, and
# the sole root entry is skipped in all four loops. The partition list comes out
# EMPTY: zero CreatePartitionJob, zero FormatPartitionJob, leaving only the
# CreatePartitionTableJob that doAutopartition queues earlier and
# unconditionally. That is precisely what the captured session log showed, job
# for job, and why lsblk saw /dev/vda with a partition table and no partitions.
#
# Declaring the layout here forces the initialised path. Lubuntu ships an
# equivalent block against this same binary, which is why the bug never surfaced
# upstream — it is the only Calamares distro tested on this package.
#
# Every entry MUST carry `name` and `size`, or init() logs "lacks mandatory
# attributes, switching to default layout", clears the list, and drops straight
# back into the broken fallback with no new symptom to notice.
#
# `filesystem: "unknown"` is deliberate, not laziness. Omitting the key defaults
# it to the literal "unformatted" (an unformatted root); hard-coding "ext4"
# would pin the filesystem and silently remove the btrfs option that
# availableFileSystemTypes above offers. "unknown" is resolved at apply time to
# whatever the user actually chose.
#
# `mountPoint: "/"` is load-bearing: layoutApply() sets the BIOS Boot flag only
# on the is_root partition. `name: "root"` reproduces the label the default path
# applied, so nothing downstream sees a change.
#
# The EFI System Partition is deliberately NOT listed: doAutopartition creates
# it before layoutApply() and advances firstFreeSector past it, so "100%" means
# 100% of what remains. The same holds for a `small` swap partition. This block
# is therefore correct on BIOS and UEFI alike, and manual partitioning never
# consults the layout at all.
#
# DO NOT "fix" the `defaultPartitionTableType is unset` warning by pinning it.
# Leaving it unset is what makes doAutopartition choose gpt for EFI and msdos
# for BIOS. Pinning msdos would give every UEFI machine an MBR table with a
# FAT32 ESP on it — trading a VM bug for a real-hardware regression on the
# ThinkPad X1 Carbon, which boots UEFI.
partitionLayout:
  - name: "root"
    filesystem: "unknown"
    mountPoint: "/"
    size: "100%"
