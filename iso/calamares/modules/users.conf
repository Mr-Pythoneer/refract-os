# Calamares users module config.
defaultGroups:
  - sudo
  # adm — WITHOUT IT THE OWNER CANNOT READ THEIR OWN LOGS. systemd's shipped
  # tmpfiles rule ACLs the persistent journal to adm and wheel, and Ubuntu's
  # /var/log/syslog is root:adm 0640. So the one account the installer creates
  # ran `journalctl -b` and got "No journal files were found" / a session-only
  # view — including in docs/thinkpad-x1-carbon.md, which tells people to capture
  # exactly that output when reporting a boot problem.
  - adm
  - audio
  - video
  - network
  - storage
  - plugdev
  - lpadmin

autologinGroup: autologin
doAutologin: false

sudoersGroup: sudo
setRootPassword: false
passwordRequirements:
  minLength: 8
