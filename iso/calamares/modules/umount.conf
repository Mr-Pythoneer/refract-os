# umount runs at the end of the exec sequence. Without a config file the module
# defaults to m_emergency = false, so a failed install leaves the target
# filesystems mounted and a stale rootMountPoint behind — which makes a second
# attempt in the same session behave unpredictably. Marking it emergency means
# it also runs when an earlier job has already failed, so the machine is left in
# a clean state either way.
emergency: true
