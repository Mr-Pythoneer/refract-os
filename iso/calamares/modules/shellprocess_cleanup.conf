# Remove the INSTALLER from the system it just installed.
#
# THE BUG THIS FIXES. iso/build.sh bakes install-refract-os.desktop into
# /usr/share/applications inside the squashfs, and unpackfs copies the squashfs
# to the target verbatim — so a freshly installed Refract OS shipped with the
# installer sitting in its app grid. Calamares' own unbranded "Install System"
# entry came along too, so users saw TWO installer launchers on a machine that
# was already installed. Clicking either offers to repartition the disk they are
# currently running from. Nothing in the sequence removed them; there was no
# cleanup step at all.
#
# The DESKTOP icon was never the problem — casper-bottom creates that, and
# casper-bottom scripts only ever execute in the live initramfs, so an installed
# system never runs one. It is the /usr/share/applications entries that leak.
#
# dontChroot: false -> runs inside the installed target, so these are its paths.
# Every command is best-effort: a cleanup failure must never fail an otherwise
# complete install, which would be a far worse outcome than a stray menu entry.
dontChroot: false
timeout: 120
script:
  - command: "/bin/sh -c 'rm -f /usr/share/applications/install-refract-os.desktop /usr/share/applications/calamares.desktop /usr/share/applications/calamares-install.desktop || true'"
    timeout: 30
  # Purge Calamares itself. Ubuntu removes ubiquity from installed systems for
  # the same reason: an installer on an installed machine is dead weight at best
  # and a disk-wipe waiting to happen at worst. Best-effort — if apt is unhappy
  # in the chroot the launchers are already gone, which is the part that matters.
  - command: "/bin/sh -c 'DEBIAN_FRONTEND=noninteractive apt-get purge -y calamares calamares-settings-refract >/dev/null 2>&1 || true'"
    timeout: 90
  # The live session's passwordless polkit grant must not survive either. It is
  # written by casper-bottom into the live overlay only, so it should already be
  # absent — this is belt-and-braces against a future change that bakes it in,
  # because the consequence (any local user can pkexec to root) is severe.
  - command: "/bin/sh -c 'rm -f /etc/polkit-1/rules.d/49-refract-installer.rules || true'"
    timeout: 30
