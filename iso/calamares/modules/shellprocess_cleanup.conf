# Strip the installer off the system it just installed.
#
# A live ISO and the machine it installs are the same filesystem — unpackfs
# copies the squashfs wholesale — so everything that exists to *install* Refract
# is still sitting there afterwards unless it is explicitly removed. On the first
# successful hardware install (2026-08-15) the "Install Refract OS" icon was
# still in the dock of the installed system, which reads as "the install didn't
# finish" to anyone who doesn't know better, and re-running it would offer to
# reinstall the machine they are sitting in front of.
#
# THE LAUNCHER FILE IS NOT THE ONLY COPY, and deleting it alone is what the first
# version of this got wrong. There are three independent references:
#   1. /usr/share/applications/install-refract-os.desktop  — the launcher
#   2. the DOCK PIN, baked into the dconf db at /etc/dconf/db/local.d/00-refract
#      as favorite-apps=[... 'install-refract-os.desktop']
#   3. the live user's ~/Desktop copy, written by casper-bottom at live boot
# Removing only (1) leaves the dock still pinning a launcher that no longer
# exists — a dead icon, which is worse than the original problem.
#
# The dock pin is REPLACED, not just deleted, with GNOME Software. That slot is
# where a new owner looks for "how do I get more apps", and gnome-software is
# already in the image (polish.list.chroot pulls it in via
# gnome-software-plugin-flatpak). Leaving the slot empty would answer the
# question with nothing.
#
# The dconf edit must run against the SOURCE file plus `dconf update` — the
# compiled binary db is what GNOME actually reads, and editing the text without
# recompiling changes nothing.
dontChroot: false
timeout: 180
script:
  # 1. The launcher itself, everywhere it can be.
  - command: "/bin/sh -c 'rm -f /usr/share/applications/install-refract-os.desktop /usr/share/applications/calamares.desktop /usr/share/applications/calamares-install.desktop /etc/skel/Desktop/install-refract-os.desktop; rm -f /home/*/Desktop/install-refract-os.desktop; rm -f /root/Desktop/install-refract-os.desktop; true'"
    timeout: 30
  # 2. The dock pin -> GNOME Software. Only swap when gnome-software is actually
  #    present, otherwise drop the entry rather than pin a second dead icon.
  #    NO LITERAL SINGLE QUOTES IN THESE EXPRESSIONS, deliberately. The obvious
  #    way to write this is to match 'install-refract-os.desktop' WITH its dconf
  #    quotes, which means embedding \' inside a single-quoted sh -c inside a
  #    double-quoted YAML scalar. That was tried and it silently substitutes
  #    NOTHING — the command exits 0 and the dock keeps its old pin, which is the
  #    worst kind of failure because it looks like it worked. The unquoted name is
  #    unique in this file, and `.` matches the surrounding quote characters, so
  #    neither branch needs a quote of its own.
  - command: "/bin/sh -c 'f=/etc/dconf/db/local.d/00-refract; [ -f \"$f\" ] || exit 0; if [ -f /usr/share/applications/org.gnome.Software.desktop ]; then sed -i \"s/install-refract-os[.]desktop/org.gnome.Software.desktop/g\" \"$f\"; else sed -i \"s/, *.install-refract-os[.]desktop.//g\" \"$f\"; fi; dconf update 2>/dev/null || true'"
    timeout: 60
  # 3. Calamares itself. Nothing on an installed desktop should be able to
  #    re-partition the machine from the app grid.
  - command: "/bin/sh -c 'DEBIAN_FRONTEND=noninteractive apt-get purge -y calamares calamares-settings-refract >/dev/null 2>&1 || true'"
    timeout: 90
  # 4. The passwordless polkit grant the live launcher needed. On an installed
  #    system this is a local privilege escalation for any desktop user, and it
  #    has no remaining purpose once calamares is gone.
  - command: "/bin/sh -c 'rm -f /etc/polkit-1/rules.d/49-refract-installer.rules || true'"
    timeout: 30
