# Calamares `bootloader` module — installs GRUB into the target and registers an
# EFI boot entry.
#
# THIS FILE WAS MISSING and, unlike `mount`, the module does NOT degrade politely:
# it indexes its config directly rather than using .get() —
#     libcalamares.job.configuration["grubInstall"]
#     libcalamares.job.configuration["grubMkconfig"]
# — and run()'s only except clause catches subprocess.CalledProcessError, so a
# missing key raises an uncaught KeyError. With no config the install either
# aborts here or (had it survived) produced a system with no bootloader at all.
---
efiBootLoader: "grub"

grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"

# THE UBUNTU-DERIVATIVE TRAP, and the reason this value is not "refract":
# upstream's own bootloader.conf warns that Debian derivatives using unmodified
# GRUB EFI packages must keep the distro's id, because the shipped grubx64.efi
# has its prefix path COMPILED IN. Ubuntu's binary looks for its config under
# \EFI\ubuntu; installing as \EFI\refract yields an EFI entry whose loader cannot
# find grub.cfg and drops to the grub rescue prompt. Refract's identity comes
# from GRUB_DISTRIBUTOR (set to "Refract OS" by
# iso/config/hooks/0200-refract-identity.chroot), which is what the user actually
# reads in the boot menu — the ESP directory name is plumbing, not branding.
efiBootloaderId: "ubuntu"

# Also drop a copy at \EFI\BOOT\bootx64.efi. Matters for firmware that ignores
# NVRAM entries, and for USB-installed/removed-disk scenarios — cheap insurance
# on the exact class of machine (UEFI-only laptops) this targets.
installEFIFallback: true

# BIOS-only: do not also write a hybrid MBR when installing in EFI mode.
installHybridGRUB: false
