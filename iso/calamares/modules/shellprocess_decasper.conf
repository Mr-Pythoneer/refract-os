# Take the LIVE boot system off the installed system.
#
# THIS IS WHY THE FIRST SUCCESSFUL INSTALL WOULD NOT BOOT. The install completed,
# GRUB was written correctly, the firmware got a "Refract OS" entry and selected
# it, the installed kernel loaded — and then the initramfs printed
#
#     Unable to find a medium containing a live file system
#     attempt interactive netboot from a URL?
#
# That message is casper's. casper is the LIVE-boot package: its whole job is to
# find a squashfs on removable media and mount it as the root filesystem. It is
# correct on a USB stick and nonsense on an installed disk, where the root
# filesystem is a real partition that is already there.
#
# It ends up on the target because unpackfs copies the squashfs WHOLESALE — the
# live image and the installed system are the same filesystem, so every package
# that exists to make the USB bootable is still present afterwards unless it is
# explicitly removed. Ubuntu's own installers (ubiquity, subiquity) purge casper
# from the target and rebuild the initramfs; Calamares does not do this for you,
# and nothing in this tree did it either.
#
# ORDER IS LOAD-BEARING: this runs BEFORE grubcfg and bootloader. The initramfs
# must be rebuilt without casper's hooks, and /etc/default/grub must be free of
# boot=casper, BEFORE grub-mkconfig reads that file and bakes the kernel command
# line into grub.cfg. Run it after those and grub.cfg keeps pointing a
# casper-free system at a casper cmdline, which fails exactly the same way.
#
# dontChroot: false -> runs inside the installed target.
dontChroot: false
timeout: 600
script:
  # 1. Purge the live-boot packages. casper pulls the initramfs hook that scans
  #    for removable media; lupin-casper is its wubi-era companion. Losing them
  #    on the target cannot hurt the live USB, which is a different filesystem.
  - command: "/bin/sh -c 'DEBIAN_FRONTEND=noninteractive apt-get purge -y casper lupin-casper live-boot live-boot-initramfs-tools >/dev/null 2>&1; true'"
    timeout: 180
  # 2. Belt and braces: drop casper's initramfs hooks and conf even if the purge
  #    was partial or the package name differs, so the rebuild in step 4 cannot
  #    pick them back up.
  - command: "/bin/sh -c 'rm -f /usr/share/initramfs-tools/scripts/casper* /usr/share/initramfs-tools/hooks/casper* /etc/casper.conf; rm -rf /usr/share/initramfs-tools/scripts/casper-*; true'"
    timeout: 30
  # 3. Strip boot=casper (and the live-only args that ride with it) out of the
  #    installed GRUB defaults, then guarantee a sane default line exists.
  #    NO SHELL VARIABLES BELOW, and this is not a style choice. Calamares expands
  #    $word and ${word} in a command BEFORE the shell ever sees it, using a
  #    dictionary containing exactly ROOT, USER and LANG. A perfectly ordinary
  #    `f=/etc/default/grub; ... "$f"` therefore aborts the install with
  #        The commands use variables that are not defined.
  #        Missing variables are: f,f,f,f
  #    — one entry per use of $f. Observed on hardware, 2026-08-15. Paths are
  #    written out in full instead. Anything that needs a variable belongs in a
  #    script shipped in the image, not in a shellprocess command string.
  - command: "/bin/sh -c '[ -f /etc/default/grub ] || exit 0; sed -i \"s/ *boot=casper//g; s/ *maybe-ubiquity//g; s/ *file=[^ ]*//g; s/ *iso-scan[^ ]*//g\" /etc/default/grub; grep -q GRUB_CMDLINE_LINUX_DEFAULT /etc/default/grub || echo GRUB_CMDLINE_LINUX_DEFAULT=\\\"quiet splash\\\" >> /etc/default/grub; true'"
    timeout: 30
  # 4. Rebuild every initramfs on the target. Without this the OLD initramfs —
  #    the one with casper baked in — is still the file GRUB loads, and removing
  #    the package changes nothing at boot.
  - command: "/bin/sh -c 'update-initramfs -u -k all >/dev/null 2>&1 || update-initramfs -u >/dev/null 2>&1; true'"
    timeout: 360
