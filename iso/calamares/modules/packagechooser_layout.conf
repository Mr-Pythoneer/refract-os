# Calamares packagechooser — the "how should the desktop LOOK" page.
# Wired as instance packagechooser@layout (settings.conf `instances:` + `show:`),
# shown immediately before the Modes page: look first, then purpose.
#
# mode: optional -> zero-or-one. It was 'required', and that was wrong, for a
#   reason worth writing down: 'required' leaves Next DISABLED until the user
#   picks, which means this page HAS NO DEFAULT AT ALL. The product decision is
#   that Refract IS the default and the picker merely lets you change it — a
#   page you cannot leave without choosing is the opposite of a default.
#
#   The old comment justified 'required' by analogy to partition.conf's
#   deliberate no-default stance. That analogy does not hold. Nothing is
#   pre-armed on the partition page because picking wrong DESTROYS DATA. Picking
#   a desktop theme destroys nothing, and distro-layoutctl can change it later at
#   any time. Trading a zero-risk choice for a hard stop buys no safety and costs
#   every installing user a page they must interact with to get past.
#
#   Measured, not theorised: install-smoke run 31579769018 stalled here forever
#   with Next greyed and "Please pick a product from the list" — the installer
#   could not complete because of this key.
#
# method: legacy -> writes GlobalStorage key `packagechooser_layout` with the
#   selected id, or the EMPTY STRING when the page is skipped. Skipping must
#   still produce a working desktop, so shellprocess_layout.conf substitutes
#   'refract' when the value is empty — see its comments. These are
#   dconf/gsettings presets applied by distro-layoutctl, NOT apt packages, so
#   Calamares must only capture the choice.
mode: optional
method: legacy

# default: PRESELECTS this item. Read out of Calamares 3.3.5's own source
# (packagechooser/Config.cpp setConfigurationMap: `getString(configurationMap,
# "default")`, matched against the item ids below), not guessed — this key is
# undocumented in the shipped example config.
#
# This is the honest way to say "Refract is the default": the item is already
# chosen when the page opens, so pressing Next straight through gives you
# Refract, and changing it is a deliberate act. Combined with mode: optional the
# page can never block the installer no matter what the user does to it.
default: refract

labels:
  step: "Look"

items:
  - id: refract
    name: "Refract"
    description: "Refract's own look — frosted liquid glass, prism accents, dock on the left. Uses GNOME's native styling, so every app matches and nothing breaks on updates. Recommended."
    screenshot: "/etc/calamares/branding/refractos/layout-refract.png"
  - id: classic
    name: "Classic"
    description: "Familiar if you're coming from Windows — full-width taskbar along the bottom, app grid where the Start button lives, window controls on the right."
    screenshot: "/etc/calamares/branding/refractos/layout-classic.png"
  - id: macos
    name: "macOS"
    description: "Floating dock at the bottom and traffic-light window controls. The look Refract shipped before. Needs a themed toolkit, so it can be disrupted by GNOME updates."
    screenshot: "/etc/calamares/branding/refractos/layout-macos.png"
  - id: minimal
    name: "Minimal"
    description: "Stock GNOME with nothing added — no dock, no blur. The fastest option and the best choice for older or low-powered machines."
    screenshot: "/etc/calamares/branding/refractos/layout-minimal.png"
