name: verify-boot-fixes

# Definitive proof that the real-hardware boot fixes are PHYSICALLY present in a
# built ISO's root filesystem — mounts the ISO, mounts casper/filesystem.squashfs
# (the exact tree that becomes the installed/live OS), and asserts each fix as a
# file/content check. This is stronger than trusting build-log echoes.

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "build-iso run id to fetch the ISO from (any strain)"
        required: true

jobs:
  inspect-squashfs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `gh run download` needs actions:read to fetch another run's artifact; the
    # default GITHUB_TOKEN is read-contents-only and would 403 without this
    # (matches boot-smoke / uefi-boot / install-smoke / mode-test).
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download the built ISO
        run: |
          set -euo pipefail
          # -p (glob), not -n (exact): the artifact is refract-os-<strain> only for
          # a full build — a mode-omitted one is refract-os-<strain>-no<mode> and a
          # testing one appends -DANGER-TESTING-NO-LOGIN, and `-n refract-os-laptop`
          # hard-fails on every one of those. The run id is an explicit input, so
          # whatever ISO that run produced is the ISO we were asked to verify.
          gh run download "${{ inputs.build_run_id }}" --repo "${{ github.repository }}" \
            -p 'refract-os-*' -D iso-dl
          # Glob the ISO too: a testing build's file is renamed
          # DANGER-DO-NOT-USE-TESTING-NO-LOGIN-refract-os-<strain>.iso, and `-p`
          # extracts each artifact into its own iso-dl/<artifact-name>/ subdir.
          iso=$(find iso-dl -name '*.iso' | head -n1)
          [ -n "$iso" ] || { echo "No .iso in run ${{ inputs.build_run_id }}'s artifacts." >&2; exit 1; }
          ls -lh "$iso"
          echo "ISO=$PWD/$iso" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Mount ISO + squashfs
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y squashfs-tools >/dev/null
          sudo mkdir -p /mnt/iso /mnt/sq
          sudo mount -o loop,ro "$ISO" /mnt/iso
          echo "ISO contents (casper):"; ls -la /mnt/iso/casper/ | grep -E "squashfs|vmlinuz|initrd|manifest" || true
          sudo mount -t squashfs -o loop,ro /mnt/iso/casper/filesystem.squashfs /mnt/sq
          echo "squashfs mounted."

      - name: Assert casper-bottom scripts actually reached the live initrd
        run: |
          set -uo pipefail
          # THE GAP THIS CLOSES: every existing casper-bottom assertion below only
          # checks the SQUASHFS copy at
          # $SQ/usr/share/initramfs-tools/scripts/casper-bottom/25-refract-install-icon
          # — a plain file staged by includes.chroot. That copy exists unconditionally
          # and proves nothing about whether the script is actually IN casper/initrd.img,
          # the archive casper's live boot really executes scripts from. The two hooks
          # that are supposed to embed it (0100-update-initramfs-for-casper.chroot,
          # 0200-refract-identity.chroot) both call bare `update-initramfs -u` with no
          # `-k` — which targets the RUNNING kernel (`uname -r`). Inside a live-build
          # chroot that command runs via chroot(2), not a real kernel switch, so
          # `uname -r` still reports the GITHUB RUNNER's kernel, not the chroot's
          # installed generic-hwe-24.04 kernel — a version that has no
          # /boot/vmlinuz-<ver> or /lib/modules/<ver> inside the chroot at all. If that
          # theory is right, the rebuild silently targets nothing and casper/initrd.img
          # never gets the current casper-bottom scripts, no matter how correct the
          # source file is. This step tests that directly, on the real shipped initrd,
          # instead of trusting the hook ran.
          fail=0
          sudo apt-get install -y initramfs-tools-core >/dev/null
          sudo unmkinitramfs /mnt/iso/casper/initrd.img /tmp/initrd-extract
          HIT=$(find /tmp/initrd-extract -path '*casper-bottom/25-refract-install-icon' 2>/dev/null | head -n1)
          if [ -z "$HIT" ]; then
            echo "  FAIL  25-refract-install-icon is NOT inside casper/initrd.img at all"
            echo "        (the squashfs copy below will still show PASS — that only proves"
            echo "         the source file exists, not that casper can run it at boot)"
            fail=1
          else
            echo "  PASS  25-refract-install-icon found in the booted initrd: $HIT"
            if grep -q 'AutomaticLoginEnable' "$HIT"; then
              echo "  PASS  the embedded copy contains the autologin fix (AutomaticLoginEnable)"
            else
              echo "  FAIL  the embedded copy is STALE — no AutomaticLoginEnable in the initrd's copy"
              echo "        (source tree has the fix; the initrd that actually boots does not)"
              fail=1
            fi
          fi
          [ "$fail" = 0 ] || { echo "INITRD IS STALE RELATIVE TO THE SOURCE TREE — DO NOT TRUST THE SQUASHFS-ONLY CHECKS BELOW."; exit 1; }

      - name: Diagnostic — dump casper's real live-user-creation script
        run: |
          set -uo pipefail
          # DIAGNOSTIC ONLY, not an assertion (always exits 0). install-smoke and
          # two rounds of manual VM login (diag-live-autologin) both proved: no
          # "ubuntu" account exists on live boot (id -u ubuntu fails; manual login
          # as ubuntu with a blank password gets "Login incorrect", the same
          # result a genuinely nonexistent account gets; root, which IS correctly
          # locked, gets the identical message, so that result alone doesn't
          # distinguish "no such user" from "locked" — but id -u failing does).
          # The `casper` .deb (build log: "Setting up casper (1.498)") ships the
          # REAL 25adduser script that is supposed to create that account — dump
          # its actual logic so the exact runtime condition it needs can be read
          # directly instead of guessed again.
          F=/mnt/sq/usr/share/initramfs-tools/scripts/casper-bottom/25adduser
          if [ -e "$F" ]; then
            echo "=== casper's real 25adduser (package casper 1.498) ==="
            cat "$F"
          else
            echo "casper's 25adduser is NOT in the squashfs at all — the package installed"
            echo "(build log confirms 'Setting up casper (1.498)') but did not ship this script,"
            echo "or something removed it after install. This would fully explain the missing user."
          fi
          echo
          echo "=== every other casper-bottom script that ships (ours + casper's own) ==="
          ls -la /mnt/sq/usr/share/initramfs-tools/scripts/casper-bottom/ 2>/dev/null || echo "directory missing entirely"
          echo
          echo "=== /etc/casper.conf as shipped (casper's own config the scripts read) ==="
          cat /mnt/sq/etc/casper.conf 2>/dev/null || echo "(no /etc/casper.conf in the squashfs)"
          echo
          # THE ACTUAL BLOCKER, captured verbatim from a break=bottom shell in the
          # live boot (diag-live-autologin round 3):
          #     Begin: Adding live session user... ... fatal: The GID 1000 is already in use.
          #     usermod: user 'ubuntu' does not exist
          #     passwd: user 'ubuntu' does not exist
          # casper's 25adduser has no `set -e`, so it continued and the account was
          # never created — which is why id -u ubuntu fails, GDM shows a bare
          # username field with no account tile, both autologin paths are dead, and
          # install-smoke burned three 40-minute timeouts. user-setup hardcodes
          # passwd/user-uid 1000 (per LP: #2004092), so whoever holds GID 1000 in
          # the shipped image wins and the live user loses. Identify the squatter.
          echo "=== WHO HOLDS UID/GID 1000 IN THE SHIPPED SQUASHFS ==="
          echo "--- group entries with gid 1000 ---"
          awk -F: '$3 == 1000' /mnt/sq/etc/group 2>/dev/null || true
          echo "--- passwd entries with uid 1000 ---"
          awk -F: '$3 == 1000' /mnt/sq/etc/passwd 2>/dev/null || true
          echo "--- all non-system groups (gid >= 1000) ---"
          awk -F: '$3 >= 1000 && $3 < 65534' /mnt/sq/etc/group 2>/dev/null || true
          echo "--- all non-system users (uid >= 1000) ---"
          awk -F: '$3 >= 1000 && $3 < 65534' /mnt/sq/etc/passwd 2>/dev/null || true

      - name: Bloat report — what actually ships, by size
        run: |
          # NO pipefail here. GitHub runs `run:` steps under `bash -e`, and every
          # pipeline below ends in `head`, which closes the pipe early and SIGPIPEs
          # its producer — with pipefail that is a non-zero status and errexit kills
          # the step mid-report (exit 2, observed on run 31558595245 after the
          # package-size table had already printed). Diagnostics must never fail
          # the job they are diagnosing.
          set +e
          set -u
          # DIAGNOSTIC, always exits 0. The package LISTS are lean (base is 11
          # packages), but ubuntu-desktop-minimal pulls a large Recommends tree
          # and that is where bloat actually hides. Report the real contents of
          # the shipped squashfs so "no bloat" is a measurement, not a claim.
          SQ=/mnt/sq
          echo "=== total installed packages ==="
          wc -l < /mnt/iso/casper/filesystem.manifest
          echo
          echo "=== 40 largest installed packages (KB, from the image's own dpkg status) ==="
          awk -F': ' '
            /^Package: /       { pkg=$2 }
            /^Installed-Size: /{ size=$2; print size"\t"pkg }
          ' "$SQ/var/lib/dpkg/status" 2>/dev/null | sort -rn | head -40
          echo
          echo "=== 25 largest directories under /usr (MB) ==="
          sudo du -sm "$SQ"/usr/* 2>/dev/null | sort -rn | head -25
          echo
          echo "=== KNOWN BLOAT SUSPECTS — present or absent? ==="
          # Things a "bare bones, no bloat" desktop should NOT be shipping.
          # snapd matters most: Ubuntu's default Firefox is a snap, which drags in
          # snapd plus its mount units and a slow first-launch, and is the single
          # most common thing people call bloat on an Ubuntu derivative.
          for p in snapd firefox thunderbird libreoffice-core rhythmbox cheese \
                   shotwell aisleriot gnome-mahjongg gnome-mines gnome-sudoku \
                   simple-scan cups printer-driver-gutenprint ubuntu-pro-client \
                   popularity-contest whoopsie apport unattended-upgrades; do
            if grep -qE "^${p}[[:space:]]" /mnt/iso/casper/filesystem.manifest; then
              echo "  PRESENT  $p"
            else
              echo "  absent   $p"
            fi
          done

      - name: App catalog — every user-visible application that ships
        run: |
          set +e
          set -u
          # The real answer to "what apps are installed": the .desktop entries a
          # user actually sees in the app grid. Package lists do not answer this
          # (metapackages hide it), and neither does dpkg (libraries dominate).
          # NoDisplay=true / Hidden=true entries are filtered out — those are
          # MIME handlers and helpers, not apps someone can launch.
          SQ=/mnt/sq
          echo "=== user-visible applications ==="
          for f in "$SQ"/usr/share/applications/*.desktop; do
            [ -e "$f" ] || continue
            grep -qiE '^(NoDisplay|Hidden)[[:space:]]*=[[:space:]]*true' "$f" && continue
            name=$(grep -m1 '^Name=' "$f" | cut -d= -f2-)
            comment=$(grep -m1 '^Comment=' "$f" | cut -d= -f2-)
            printf '%-34s | %s\n' "${name:-$(basename "$f" .desktop)}" "${comment:-—}"
          done | sort
          echo
          echo "=== count ==="
          ls "$SQ"/usr/share/applications/*.desktop 2>/dev/null | wc -l
          echo
          echo "=== security posture (is anything AV-like present?) ==="
          for p in clamav clamav-daemon apparmor ufw firewalld rkhunter chkrootkit file-roller; do
            if [ -e "$SQ/usr/sbin/$p" ] || [ -e "$SQ/usr/bin/$p" ] || grep -qE "^${p}[[:space:]]" /mnt/iso/casper/filesystem.manifest 2>/dev/null; then
              echo "  PRESENT  $p"
            else
              echo "  absent   $p"
            fi
          done

      - name: Assert every boot fix is physically in the image
        run: |
          set -uo pipefail
          SQ=/mnt/sq
          fail=0
          chk() { # name, test-cmd
            if eval "$2" >/dev/null 2>&1; then echo "  PASS  $1"; else echo "  FAIL  $1"; fail=1; fi
          }
          skip() { echo "  SKIP  $1 — not applicable to this strain"; }
          # STRAIN AWARENESS. Most assertions below encode GNOME-specific boot
          # fixes (gdm3's WaylandEnable, the ubuntu-xorg session, the Intel DDX
          # purge, gnome-shell in the manifest). They are only meaningful on the
          # GNOME strains — workstation/laptop/handheld ship ubuntu-desktop-
          # minimal, lowspec ships lubuntu-desktop (LXQt + SDDM, and build.sh
          # deliberately skips the whole polish layer for it), and server/cloud
          # ship no desktop at all. Run unguarded, this job red-Xes a perfectly
          # good lowspec image with ~8 failures that are all "correct behaviour
          # for that strain" — which is exactly what happened on run 30814792796
          # and is worse than no check, because it trains you to ignore reds.
          # Detect the desktop from the image itself rather than trusting a
          # workflow input, so the check cannot disagree with what actually shipped.
          if [ -e "$SQ/usr/bin/gnome-shell" ]; then DESKTOP=gnome
          elif [ -e "$SQ/usr/bin/startlxqt" ] || [ -e "$SQ/usr/bin/lxqt-session" ]; then DESKTOP=lxqt
          else DESKTOP=headless; fi
          echo "Detected desktop in this image: $DESKTOP"
          # CROSS-CHECK THE DETECTION AGAINST THE STRAIN. Detecting the desktop
          # from the image is right for strain-awareness, but on its own it turns
          # a CATASTROPHE into a skip: when the debloat hook deleted GNOME from a
          # workstation image, this job saw no /usr/bin/gnome-shell, concluded
          # "headless", SKIPPED every desktop assertion, and reported SUCCESS. An
          # image that boots to a tty1 login prompt passed its own verification.
          # The strain name says what the image is SUPPOSED to be; if the two
          # disagree, that is the bug, not a reason to skip.
          STRAIN_HINT=$(find iso-dl -name '*.iso' | head -n1 | sed -E 's#.*refract-os-([a-z]+).*#\1#')
          echo "Strain (from artifact name): ${STRAIN_HINT:-unknown}"
          case "$STRAIN_HINT" in
            workstation|laptop|handheld)
              if [ "$DESKTOP" != gnome ]; then
                echo "  FAIL  strain '$STRAIN_HINT' MUST ship GNOME but detected '$DESKTOP'" >&2
                echo "        The desktop is missing from an image that requires one — every" >&2
                echo "        assertion below would silently SKIP and this job would pass." >&2
                exit 1
              fi
              echo "  PASS  strain '$STRAIN_HINT' correctly ships GNOME" ;;
            lowspec)
              if [ "$DESKTOP" != lxqt ]; then
                echo "  FAIL  strain 'lowspec' MUST ship LXQt but detected '$DESKTOP'" >&2; exit 1
              fi
              echo "  PASS  strain 'lowspec' correctly ships LXQt" ;;
            server|cloud)
              echo "  PASS  strain '$STRAIN_HINT' is headless by design (detected '$DESKTOP')" ;;
            *)
              echo "  NOTE  could not infer strain from the artifact name — detection not cross-checked." ;;
          esac
          echo
          echo "=== GDM forced to Xorg ==="
          if [ "$DESKTOP" != gnome ]; then
            skip "all GNOME/gdm3 boot-fix assertions ($DESKTOP image)"
          else
          # custom.conf is the file Ubuntu's gdm3 READS. This used to assert on
          # daemon.conf (Debian's name) — the same file the hook wrote — so it
          # passed while the setting was inert and the machine booted Wayland.
          # Assert the real one; daemon.conf is checked too, but it is the inert
          # belt-and-braces copy, not the thing that makes the fix work.
          chk "WaylandEnable=false in /etc/gdm3/custom.conf (the file Ubuntu gdm3 reads)" \
              "grep -q '^WaylandEnable=false' $SQ/etc/gdm3/custom.conf"
          chk "WaylandEnable=false in /etc/gdm3/daemon.conf (inert Debian-name copy)" \
              "grep -q '^WaylandEnable=false' $SQ/etc/gdm3/daemon.conf"
          echo "=== Xorg session exists (so gdm has something to launch) ==="
          chk "ubuntu-xorg.desktop present" \
              "test -e $SQ/usr/share/xsessions/ubuntu-xorg.desktop"
          echo "=== Intel forced to modesetting, legacy DDX gone ==="
          chk "xorg.conf.d/20-intel-modesetting.conf forces modesetting" \
              "grep -qi 'modesetting' $SQ/etc/X11/xorg.conf.d/20-intel-modesetting.conf"
          chk "legacy intel DDX (intel_drv.so) is PURGED" \
              "! test -e $SQ/usr/lib/xorg/modules/drivers/intel_drv.so"
          chk "modesetting driver IS available" \
              "test -e $SQ/usr/lib/xorg/modules/drivers/modesetting_drv.so"
          echo "=== no Ubuntu setup wizard ==="
          chk "gnome-initial-setup binary is PURGED" \
              "! test -e $SQ/usr/libexec/gnome-initial-setup"
          fi   # end GNOME-only boot-fix assertions
          echo "=== the installer's own binary dependencies are present ==="
          # Calamares shells out to these; a missing one fails the job with exit
          # 127 (command not found) MID-INSTALL, after partitioning has already
          # written to the disk. rsync was absent from every package list and
          # nothing pulled it in, so unpackfs died with "rsync failed with error
          # code 127" and no install could ever complete — on any strain, on any
          # hardware. Nothing caught it because every existing check verified
          # Calamares' CONFIG, never the binaries its modules invoke.
          chk "rsync present (unpackfs copies the squashfs with it)" \
              "test -x $SQ/usr/bin/rsync"
          chk "unsquashfs present (unpackfs' squashfs path)" \
              "test -x $SQ/usr/bin/unsquashfs"
          # THE FULL INSTALLER TOOLCHAIN. rsync being absent (exit 127) proved
          # this class of bug is real and completely invisible to config checks:
          # Calamares shells out to a set of binaries, and a missing one fails
          # MID-INSTALL after the disk has already been written to. The partition
          # module is the current suspect — the target root never mounts, which
          # is what a failed mkfs would look like — so assert every tool the
          # partition/mount/bootloader path needs, not just the one that already
          # bit us. Each is a plausible silent exit-127.
          for _t in mkfs.ext4:sbin mkfs.vfat:sbin mkfs.btrfs:sbin mkswap:sbin \
                    parted:sbin partprobe:sbin blkid:sbin wipefs:sbin \
                    sgdisk:sbin cryptsetup:sbin grub-install:sbin \
                    mount:bin umount:bin mountpoint:bin lsblk:bin findmnt:bin; do
            _n="${_t%%:*}"
            if [ -x "$SQ/usr/sbin/$_n" ] || [ -x "$SQ/sbin/$_n" ] \
               || [ -x "$SQ/usr/bin/$_n" ] || [ -x "$SQ/bin/$_n" ]; then
              echo "  PASS  installer tool present: $_n"
            else
              echo "  FAIL  installer tool MISSING: $_n — Calamares will exit 127 mid-install"
              fail=1
            fi
          done
          echo "=== UID/GID 1000 is FREE for casper's live user (regression guard) ==="
          # casper creates the live session user at UID/GID 1000 (user-setup sets
          # passwd/user-uid 1000, per LP: #2004092). If ANY packaged user or group
          # in the shipped image already holds 1000, user-setup-apply aborts with
          # "fatal: The GID 1000 is already in use." and casper's 25adduser — which
          # has no `set -e` — silently continues, producing a live image with NO
          # live user: no autologin on any path, a GDM prompt with no account to
          # list, and an unreachable desktop. That is exactly what keyd's Makefile
          # did (it created a REGULAR group, taking 1000); 0410-keyd.chroot now
          # pre-creates it with groupadd -r. This is the guard that makes a repeat
          # impossible to ship unnoticed, from any package, on any strain.
          chk "no group holds GID 1000 (casper's live user needs it)" \
              "! awk -F: '\$3 == 1000' $SQ/etc/group | grep -q ."
          chk "no user holds UID 1000 (casper's live user needs it)" \
              "! awk -F: '\$3 == 1000' $SQ/etc/passwd | grep -q ."
          echo "=== firmware for the iGPU is present ==="
          # Not GNOME-gated: every strain needs i915 firmware for Intel graphics.
          chk "i915 DMC/GuC firmware dir present" \
              "test -d $SQ/lib/firmware/i915"
          echo
          echo "=== installer polkit grant is LIVE-ONLY (security) ==="
          # SECURITY: the passwordless installer grant must NOT be in the installed
          # tree. If 49-refract-installer.rules shipped inside the squashfs, it
          # would land on every installed desktop, where any local+active user
          # could 'pkexec bash' into a passwordless root shell. It is now written
          # by the casper-bottom hook into the LIVE overlay only (an installed
          # system never runs casper-bottom), so the installed squashfs must be
          # rule-free.
          chk "installed squashfs has NO 49-refract-installer.rules (no passwordless root)" \
              "! test -e $SQ/etc/polkit-1/rules.d/49-refract-installer.rules"
          # ...but the live-only generator MUST still ship, or the live installer
          # loses its passwordless disk/pkexec/reboot grant and can't launch. The
          # casper-bottom hook is baked into the initrd from this squashfs path and
          # writes the rule into /root (the live overlay) at boot.
          # DESKTOP-ONLY. iso/build.sh removes the whole casper-bottom directory
          # and only recreates it for non-headless strains (there is no installer
          # to launch on server/cloud), so asserting these unconditionally failed
          # a CORRECT headless ISO with "DO NOT FLASH". The absence check above
          # stays unconditional — build.sh purges that rule for every strain.
          if [ "$DESKTOP" != headless ]; then
            chk "casper-bottom hook 25-refract-install-icon ships (live grant generator)" \
                "test -e $SQ/usr/share/initramfs-tools/scripts/casper-bottom/25-refract-install-icon"
            chk "that hook writes the live installer polkit rule at boot" \
                "grep -q '49-refract-installer.rules' $SQ/usr/share/initramfs-tools/scripts/casper-bottom/25-refract-install-icon"
          else
            skip "casper-bottom installer-icon hook (headless strain ships no installer)"
          fi
          echo
          echo "=== ISO slimming took effect AND spared what must survive ==="
          # The compressor is the single biggest size lever (~20-30%) and it is
          # set through an EMPIRICALLY-verified, undocumented channel: a
          # MKSQUASHFS_OPTIONS line build.sh appends to config/binary. If a
          # live-build change ever starts overriding that, the build still
          # succeeds — it just silently reverts to gzip, the ISO balloons ~500 MB
          # past the 2 GiB cap, and releases quietly regress to split parts that
          # balenaEtcher cannot flash. Assert the shipped compressor directly.
          chk "shipped squashfs is xz-compressed (not a silent gzip regression)" \
              "unsquashfs -s /mnt/iso/casper/filesystem.squashfs | grep -qi 'Compression[[:space:]]*xz'"
          # The size levers (config/binary_rootfs/excludes + --apt-indices false)
          # fail SILENTLY if the fork ignores them — the build still succeeds,
          # just 300+ MB fatter, and the release quietly regresses to split
          # parts. So assert both directions: the excluded junk is really gone,
          # and the two things the excludes must NEVER take with them survive.
          chk "man pages excluded (proves binary_rootfs/excludes engaged)" \
              "! ls $SQ/usr/share/man/man1/ >/dev/null 2>&1 || [ -z \"\$(ls -A $SQ/usr/share/man/man1/ 2>/dev/null)\" ]"
          chk "apt package indices excluded (proves --apt-indices false engaged)" \
              "[ -z \"\$(ls -A $SQ/var/lib/apt/lists/ 2>/dev/null | grep -v ^lock$ | grep -v ^partial$ | grep -v ^auxfiles$)\" ]"
          chk "kernel headers excluded (/usr/src empty — ~175 MB of build artifacts)" \
              "[ -z \"\$(ls -A $SQ/usr/src 2>/dev/null)\" ]"
          chk "licence/copyright files SURVIVE the excludes (GPL compliance)" \
              "ls $SQ/usr/share/doc/*/copyright >/dev/null 2>&1"
          chk "English locale SURVIVES the locale excludes" \
              "test -d $SQ/usr/share/locale/en || test -d $SQ/usr/share/locale/en_GB || test -d $SQ/usr/share/locale/en@shaw"
          echo
          # THE macOS LOOK. This is asserted because it silently vanished for
          # months: WhiteSur's installer sources a lib that runs `set -Eeo
          # pipefail` and then dies on `getent passwd ""` when USER is unset in the
          # chroot, so it exited in milliseconds with no output. Icons shipped
          # (their installer doesn't use that lib), the GTK theme did not, and the
          # desktop defaults still NAMED MacTahoe-Dark — so GTK fell back to
          # Adwaita and the headline look was simply absent, with nothing failing.
          # Only build.sh's GNOME strains get this layer; server/cloud/lowspec have
          # the hook stripped, so gate on the same $DESKTOP the rest of this job uses.
          echo "=== macOS look (GNOME strains only) ==="
          if [ "$DESKTOP" = gnome ]; then
            chk "MacTahoe-Dark GTK theme installed (the look actually shipped)" \
                "test -d $SQ/usr/share/themes/MacTahoe-Dark"
            chk "MacTahoe GNOME Shell theme present (user-theme extension target)" \
                "test -e $SQ/usr/share/themes/MacTahoe-Dark/gnome-shell/gnome-shell.css"
            chk "MacTahoe (macOS 26) icon theme installed" \
                "test -d $SQ/usr/share/icons/MacTahoe-dark"
            chk "layout presets ship (refract/classic/macos/minimal)" \
                "test -e $SQ/opt/distro/modes/layouts/profiles/refract.conf && test -e $SQ/opt/distro/modes/layouts/profiles/macos.conf"
            chk "distro-layoutctl is in PATH" \
                "test -L $SQ/usr/local/bin/distro-layoutctl"
            chk "default layout is refract, not macos" \
                "grep -qx refract $SQ/etc/refract/layout"
            chk "first-login layout applier staged in /etc/skel" \
                "test -e $SQ/etc/skel/.config/autostart/refract-layout.desktop && test -x $SQ/usr/local/lib/refract/apply-layout-once"
            chk "Papirus icons present (non-macOS layouts need them)" \
                "test -d $SQ/usr/share/icons/Papirus-Dark"
            # Assert the THEME's own asset dir, not gtk.css. gtk.css is written
            # unconditionally by build.sh's accent bake (search: "Baked Normal's
            # accent"), so testing for it passed on a file a different feature
            # always creates — a vacuous PASS that reported the libadwaita config
            # as present while the build log said "no GTK4/libadwaita config
            # produced". assets/ comes only from install.sh -l.
            chk "MacTahoe libadwaita assets staged (GTK4 apps themed)" \
                "test -d $SQ/etc/skel/.config/gtk-4.0/assets"
            chk "Blur-my-Shell assembled (Normal mode's liquid glass)" \
                "test -e $SQ/usr/share/gnome-shell/extensions/blur-my-shell@aunetx/extension.js"
            # The defaults must name a theme that EXISTS. This is the assertion that
            # would have caught the original bug on its own: a desktop pointed at a
            # missing theme is indistinguishable from stock GNOME at a glance.
            chk "gtk-theme default names an INSTALLED theme (no phantom theme)" \
                "t=\$(sed -n \"s/^gtk-theme='\\(.*\\)'/\\1/p\" $SQ/usr/share/glib-2.0/schemas/99_refract.gschema.override | head -n1); [ -n \"\$t\" ] && test -d \"$SQ/usr/share/themes/\$t\""
          else
            skip "macOS-look assertions ($DESKTOP image — build.sh strips that layer)"
          fi
          echo
          echo "=== installed-package cross-check (filesystem.manifest) ==="
          MAN=/mnt/iso/casper/filesystem.manifest
          # Absence checks are universal — the legacy Intel DDX and the Ubuntu
          # setup wizard must be missing from EVERY strain, desktop or not.
          chk "manifest: xserver-xorg-video-intel ABSENT" \
              "! grep -q '^xserver-xorg-video-intel' $MAN"
          chk "manifest: gnome-initial-setup ABSENT" \
              "! grep -q '^gnome-initial-setup' $MAN"
          # Presence checks are GNOME-only: lowspec ships LXQt (lubuntu-desktop)
          # and server/cloud ship no desktop, so demanding gnome-shell there
          # fails a correct image.
          if [ "$DESKTOP" = gnome ]; then
            chk "manifest: ubuntu-session PRESENT (provides the xsession)" \
                "grep -q '^ubuntu-session' $MAN"
            chk "manifest: gnome-shell PRESENT" \
                "grep -q '^gnome-shell' $MAN"
          elif [ "$DESKTOP" = lxqt ]; then
            chk "manifest: lubuntu-desktop PRESENT (this strain's desktop)" \
                "grep -q '^lubuntu-desktop' $MAN"
          else
            skip "desktop-package presence checks (headless image)"
          fi
          echo
          if [ "$fail" = 0 ]; then
            echo "ALL BOOT FIXES VERIFIED PRESENT IN THE SHIPPED IMAGE."
          else
            echo "ONE OR MORE FIXES MISSING FROM THE IMAGE — DO NOT FLASH."; exit 1
          fi

      - name: Cleanup
        if: always()
        run: sudo umount /mnt/sq /mnt/iso 2>/dev/null || true
