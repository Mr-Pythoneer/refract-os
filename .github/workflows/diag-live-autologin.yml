name: diag-live-autologin

# ONE-OFF DIAGNOSTIC, not a permanent gate. Round 2.
#
# Round 1 (this same workflow) found autologin fails on BOTH independent paths:
# GDM (custom.conf, added in d6800db) AND 0400-polish.chroot's completely
# separate `agetty --autologin ubuntu` on tty3, which only fires when
# `id -u ubuntu` succeeds at getty-start — so tty3 fell back to a plain login
# prompt, meaning that check itself failed at boot. GDM also showed a blank
# free-text Username FIELD rather than a clickable user tile, which is what GDM
# renders when AccountsService has no normal user to list — not what it renders
# for "autologin misconfigured but the account exists".
#
# Two failures sharing nothing but the literal string "ubuntu" points at one
# question: does the live user actually get created at all, under ANY name.
# This round answers that directly — attempt a manual login as ubuntu (blank
# password, casper's live user standard), then root, then dump /etc/passwd's
# tail from whichever shell (if either) succeeds. That tail reveals the REAL
# live username if it exists under a different name, or confirms no live user
# was created at all.

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "build-iso run id to fetch the ISO from"
        required: true

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download the built ISO
        run: |
          set -euo pipefail
          gh run download "${{ inputs.build_run_id }}" --repo "${{ github.repository }}" \
            -p 'refract-os-*' -D iso-dl
          iso=$(find iso-dl -name '*.iso' | head -n1)
          [ -n "$iso" ] || { echo "No .iso in run ${{ inputs.build_run_id }}'s artifacts." >&2; exit 1; }
          mv "$iso" refract.iso
          ls -lh refract.iso
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Prepare QEMU + vncdotool
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils socat python3-pip
          pipx install vncdotool 2>/dev/null || pip install --user vncdotool
          [ -e /dev/kvm ] && sudo chmod 666 /dev/kvm && echo "ACCEL=kvm" >> "$GITHUB_ENV" || echo "ACCEL=tcg" >> "$GITHUB_ENV"

      - name: Boot live, try manual login as ubuntu then root, dump /etc/passwd
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p shots
          qemu-system-x86_64 -accel "$ACCEL" -m 4096 -smp 4 \
            -cdrom refract.iso -boot d \
            -display none -vga std -vnc :0 \
            -monitor unix:mon.sock,server,nowait -pidfile qemu.pid -daemonize
          mon() { printf '%s\n' "$1" | socat - unix-connect:mon.sock >/dev/null; }
          shot() { mon "screendump $PWD/shots/$1.ppm"; sleep 1; }
          vd() { vncdo -s localhost:0 "$@"; }

          echo "Waiting for GDM to settle (~3.5 min)..."
          sleep 210
          shot 00-gdm

          vd key ctrl-alt-f3; sleep 8
          shot 01-tty3-prompt

          # Plain word, no shell metacharacters — round 1's typed text landed in
          # the username FIELD (autologin never fired), so this is a fresh manual
          # login attempt, not a command inside an already-open shell.
          vd type 'ubuntu'; vd key enter; sleep 3
          shot 02-ubuntu-username-sent

          # casper's standard live user ships with an empty password; try blank.
          vd key enter; sleep 3
          shot 03-ubuntu-blank-password-result

          # If that didn't produce a shell, retry clean as root (also try blank).
          vd type 'root'; vd key enter; sleep 3
          shot 04-root-username-sent
          vd key enter; sleep 3
          shot 05-root-blank-password-result

          # Whichever attempt succeeded (if either), this reveals the actual
          # non-system accounts that exist on the live overlay right now — the
          # real answer to "does a live user exist, and under what name".
          vd type 'getent passwd 1000 1001 1002; cat /etc/passwd | tail -6'
          vd key enter; sleep 3
          shot 06-passwd-tail

          mon "quit" || true

      - name: Convert screenshots to PNG
        if: always()
        run: |
          set -euo pipefail
          sudo apt-get install -y imagemagick >/dev/null 2>&1 || true
          for f in shots/*.ppm; do
            [ -e "$f" ] || continue
            convert "$f" "${f%.ppm}.png" && rm -f "$f" || true
          done
          ls -lh shots/ || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-autologin-evidence-r2
          path: shots/
          retention-days: 7
