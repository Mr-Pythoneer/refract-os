name: diag-live-autologin

# ONE-OFF DIAGNOSTIC, not a permanent gate. Round 3.
#
# Rounds 1-2 (this same workflow) plus install-smoke's three timeouts converge
# on: no "ubuntu" account exists on live boot at all (id -u ubuntu fails at
# getty-start; manual login as ubuntu with a blank password gets the same
# "Login incorrect" a genuinely nonexistent account gets). verify-boot-fixes'
# dump of casper's REAL 25adduser script (package casper 1.498, confirmed
# installed) showed the actual user-creation call is:
#     chroot /root /usr/lib/user-setup/user-setup-apply > /dev/null
# with NO `set -e` anywhere in the script — if that call fails, 25adduser just
# keeps going silently. user-setup (which provides that binary) was also
# confirmed installed during the build, so it isn't simply missing.
#
# Rounds 1-2 hit a chicken-and-egg wall: diagnosing further needs a shell, and
# the account needed to get one doesn't exist. This round sidesteps that with
# initramfs-tools' own `break=bottom` debug hook — a real root shell dropped
# INSIDE the live boot, right after casper-bottom scripts (including 25adduser)
# have already run, no user account required at all. From there this manually
# re-invokes user-setup-apply and captures its real exit code and output —
# the most direct possible answer, rather than another guess.

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "build-iso run id to fetch the ISO from"
        required: true

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download the built ISO
        run: |
          set -euo pipefail
          gh run download "${{ inputs.build_run_id }}" --repo "${{ github.repository }}" \
            -p 'refract-os-*' -D iso-dl
          iso=$(find iso-dl -name '*.iso' | head -n1)
          [ -n "$iso" ] || { echo "No .iso in run ${{ inputs.build_run_id }}'s artifacts." >&2; exit 1; }
          mv "$iso" refract.iso
          ls -lh refract.iso
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Prepare QEMU + vncdotool
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils socat python3-pip libarchive-tools
          pipx install vncdotool 2>/dev/null || pip install --user vncdotool
          [ -e /dev/kvm ] && sudo chmod 666 /dev/kvm && echo "ACCEL=kvm" >> "$GITHUB_ENV" || echo "ACCEL=tcg" >> "$GITHUB_ENV"
          mkdir -p extract && bsdtar -xf refract.iso -C extract casper/vmlinuz casper/initrd.img
          ls -lh extract/casper/

      - name: Boot with break=bottom, inspect + re-run user-setup-apply directly
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p shots
          # break=bottom: initramfs-tools drops to /bin/sh right after casper-bottom
          # scripts (25adduser among them) have run. console=tty0 (not ttyS0) so the
          # break shell lands on the VGA framebuffer, where -vga std -vnc :0 and
          # vncdo can see and type into it — same technique already proven for tty3.
          qemu-system-x86_64 -accel "$ACCEL" -m 4096 -smp 4 \
            -kernel extract/casper/vmlinuz -initrd extract/casper/initrd.img \
            -append "boot=casper break=bottom console=tty0" \
            -cdrom refract.iso \
            -display none -vga std -vnc :0 \
            -monitor unix:mon.sock,server,nowait -pidfile qemu.pid -daemonize
          mon() { printf '%s\n' "$1" | socat - unix-connect:mon.sock >/dev/null; }
          shot() { mon "screendump $PWD/shots/$1.ppm"; sleep 1; }
          vd() { vncdo -s localhost:0 "$@"; }

          echo "Waiting for the break=bottom shell (~60-90s)..."
          sleep 75
          shot 00-break-shell
          # Confirm we actually got a shell, not still booting.
          vd key enter; sleep 3
          shot 01-shell-confirm

          vd type 'cat /root/etc/passwd | tail -5'; vd key enter; sleep 2
          shot 02-passwd-tail

          vd type 'ls -la /root/usr/lib/user-setup/user-setup-apply'; vd key enter; sleep 2
          shot 03-usersetup-binary-exists

          # THE key check: manually re-run exactly what 25adduser runs, with the
          # SAME debconf answers it would have set (username/password), and
          # capture the real exit code instead of the silent no-`set -e` failure
          # 25adduser itself would have hidden.
          vd type 'chroot /root /usr/lib/user-setup/user-setup-apply; echo EXIT=$?'
          vd key enter; sleep 6
          shot 04-usersetup-manual-run

          vd type 'cat /root/etc/casper.conf 2>&1'; vd key enter; sleep 2
          shot 05-casper-conf

          mon "quit" || true

      - name: Convert screenshots to PNG
        if: always()
        run: |
          set -euo pipefail
          sudo apt-get install -y imagemagick >/dev/null 2>&1 || true
          for f in shots/*.ppm; do
            [ -e "$f" ] || continue
            convert "$f" "${f%.ppm}.png" && rm -f "$f" || true
          done
          ls -lh shots/ || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-autologin-evidence-r3
          path: shots/
          retention-days: 7
