name: install-smoke

# Tests the Calamares installer without any hardware. Two jobs:
#
#   inspect  — mount the live squashfs (the exact filesystem unpackfs copies to
#              the target) on the runner and assert the installer is correctly
#              assembled: Calamares present, every shipped Calamares config
#              present, the unpackfs SOURCE path matches where the squashfs
#              actually lives on the medium, and the distro CLIs run in the real
#              image userland (overlay + chroot). Deterministic.
#
#   install  — boot the live ISO in QEMU with a blank target disk, drive
#              Calamares over VNC (vncdotool on the runner — no in-guest tooling
#              needed) through an erase-disk install, then boot the INSTALLED
#              disk with no ISO attached and assert it reaches userspace. This
#              is the first end-to-end exercise of partition -> unpackfs -> grub.

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "build-iso run id (empty = latest successful FULL build)"
        required: false
        default: ""
      artifact:
        description: "ISO artifact name (empty = the run's full refract-os-<strain>)"
        required: false
        default: ""
      phase:
        description: "which job(s) to run"
        type: choice
        required: false
        default: "both"
        options: [both, inspect, install]

jobs:
  inspect:
    if: ${{ inputs.phase != 'install' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve build run + artifact
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN: ${{ inputs.build_run_id }}
          INPUT_ARTIFACT: ${{ inputs.artifact }}
        run: |
          set -euo pipefail
          # Resolve the artifact by NAME, never a bare `refract-os-*` glob: a
          # mode-omitted build uploads refract-os-<strain>-no<mode> and a testing
          # build appends -DANGER-TESTING-NO-LOGIN. Both match refract-os-* and
          # both would red-X this job for a phantom reason (an -noai image has no
          # ai mode to install; a DANGER image has no login). A FULL build's
          # artifact is exactly refract-os-<strain> — no -no*/-DANGER tail.
          pick() {  # pick <run-id> -> wanted artifact name, empty if it has none
            local list
            list=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$1/artifacts" \
                     --jq '.artifacts[] | select(.expired | not) | .name') || return 0
            if [ -n "$INPUT_ARTIFACT" ]; then
              printf '%s\n' "$list" | grep -xF -- "$INPUT_ARTIFACT" || true
            else
              printf '%s\n' "$list" | grep -E '^refract-os-[a-z0-9]+$' | head -n1 || true
            fi
          }
          if [ -n "$INPUT_RUN" ]; then
            id="$INPUT_RUN"; art=$(pick "$id")
          else
            # Newest-first, first run that STILL has the wanted artifact: a
            # -noai/DANGER (or expired) build is skipped, not silently tested.
            id=""; art=""
            for cand in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-iso.yml \
                            --status success --limit 20 --json databaseId -q '.[].databaseId'); do
              art=$(pick "$cand")
              if [ -n "$art" ]; then id="$cand"; break; fi
            done
          fi
          [ -n "$id" ] && [ -n "$art" ] || {
            echo "No build-iso run with a ${INPUT_ARTIFACT:-full refract-os-<strain>} artifact (mode-omitted/testing builds don't count — pass 'artifact' to force one)." >&2
            exit 1; }
          echo "using run $id, artifact $art"
          { echo "id=$id"; echo "artifact=$art"; } >> "$GITHUB_OUTPUT"

      - name: Download ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.run.outputs.artifact }}
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
          path: iso-dl

      - name: Mount the live squashfs
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y libarchive-tools squashfs-tools
          ISO=$(find iso-dl -name "*.iso" | head -n1); [ -n "$ISO" ] || { echo "no iso" >&2; exit 1; }
          mkdir -p x
          bsdtar -xf "$ISO" -C x casper/filesystem.squashfs
          ls -lh x/casper/filesystem.squashfs
          sudo mkdir -p /mnt/sq
          sudo mount -t squashfs -o loop,ro x/casper/filesystem.squashfs /mnt/sq
          echo "SQUASHFS_OK=1" >> "$GITHUB_ENV"

      - name: Assert installer is correctly assembled
        run: |
          set -euo pipefail
          fail=0
          chk() { if eval "$2"; then echo "ok   $1"; else echo "FAIL $1"; fail=1; fi; }

          chk "Calamares binary is in the image"            '[ -x /mnt/sq/usr/bin/calamares ]'
          chk "settings.conf present"                       '[ -f /mnt/sq/etc/calamares/settings.conf ]'
          chk "modules/unpackfs.conf present"               '[ -f /mnt/sq/etc/calamares/modules/unpackfs.conf ]'
          chk "modules/partition.conf present"              '[ -f /mnt/sq/etc/calamares/modules/partition.conf ]'
          chk "modules/users.conf present"                  '[ -f /mnt/sq/etc/calamares/modules/users.conf ]'
          chk "branding present"                            '[ -d /mnt/sq/etc/calamares/branding/refractos ]'
          chk "install .desktop launcher present"           '[ -f /mnt/sq/usr/share/applications/install-refract-os.desktop ]'
          chk "distro-modectl symlink in PATH"              '[ -L /mnt/sq/usr/local/bin/distro-modectl ]'
          chk "distro scripts rsynced into /opt/distro"     '[ -f /mnt/sq/opt/distro/modes/modectl/distro-modectl ]'

          # The unpackfs SOURCE must be exactly where the squashfs lives on the
          # booted medium. casper mounts the ISO at /cdrom and the squashfs is
          # casper/filesystem.squashfs — that's what unpackfs.conf must name.
          src=$(python3 -c "import yaml;print(yaml.safe_load(open('/mnt/sq/etc/calamares/modules/unpackfs.conf'))['unpack'][0]['source'])")
          echo "unpackfs source = $src"
          chk "unpackfs source is /cdrom/casper/filesystem.squashfs" '[ "$src" = "/cdrom/casper/filesystem.squashfs" ]'

          # Every conf we ship must actually be LOADED by the sequence — an
          # orphaned conf is dead config (the rootfs/unpackfs instance bug).
          # A bare sequence entry loads <module>.conf, but a NAMED INSTANCE
          # ('<module>@<id>') loads the conf named by settings.conf's 'instances:'
          # block instead, so packagechooser@modes is what makes
          # packagechooser_modes.conf a used conf. Resolve through 'instances:'
          # before comparing, or every instance-only conf looks orphaned.
          if python3 - <<'PY'
          import yaml, os, sys
          s = yaml.safe_load(open('/mnt/sq/etc/calamares/settings.conf'))
          seq = []
          for phase in s['sequence']:
              for k, v in phase.items():
                  seq += v
          # (module, id) -> conf filename. Calamares defaults an instance that
          # omits 'config:' to <module>.conf, same as a bare entry.
          inst = {(i['module'], i['id']): i.get('config', i['module'] + '.conf')
                  for i in (s.get('instances') or [])}
          used = set()
          for entry in seq:
              if '@' in entry:
                  mod, iid = entry.split('@', 1)
                  conf = inst.get((mod, iid), mod + '.conf')
              else:
                  conf = entry + '.conf'
              used.add(conf[:-5])
          shipped = {f[:-5] for f in os.listdir('/mnt/sq/etc/calamares/modules') if f.endswith('.conf')}
          orphaned = sorted(shipped - used)
          print("sequence:", seq)
          print("instances:", {f"{m}@{i}": c for (m, i), c in inst.items()})
          print("shipped module configs:", sorted(shipped))
          if orphaned:
              print("ORPHANED (shipped but no sequence entry loads it):", orphaned)
          sys.exit(1 if orphaned else 0)
          PY
          then echo "ok   every shipped module conf is used by the sequence"
          else echo "FAIL every shipped module conf is used by the sequence"; fail=1
          fi

          # ...and the REVERSE direction, which this check was structurally blind
          # to. It only ever computed `shipped - used` (orphans), so a module the
          # sequence NEEDS but whose conf nobody wrote sailed through: mount,
          # displaymanager and bootloader were all missing at once, which is why
          # Calamares had never completed an install. Noble's `calamares` package
          # ships no /usr/share/calamares/modules defaults to fall back on.
          #
          # Only modules that genuinely NEED a conf are listed. Most C++ modules
          # (locale, keyboard, summary, machineid, localecfg, networkcfg, hwclock,
          # umount, finished) and the tolerant Python ones (fstab, grubcfg — all
          # .get() with defaults) are correct with no file, so asserting on every
          # sequence entry would just cry wolf.
          if python3 - <<'PY'
          import yaml, os, sys
          # Each entry: module -> why a missing conf is a real bug, verified in
          # upstream Calamares source (3.3.x).
          REQUIRES_CONF = {
              'mount':          'main.py warns and CONTINUES with no extraMounts, so /proc /sys /dev /run /efivars are never mounted and every later chrooted job runs in a bare chroot',
              'displaymanager': 'main.py returns an error tuple ("No display managers selected") which ABORTS the install',
              'bootloader':     'indexes configuration["grubInstall"]/["grubMkconfig"] directly -> uncaught KeyError, no bootloader installed',
              'unpackfs':       'no source/destination means nothing is copied to the target',
              'partition':      'partitioning behaviour must be pinned, not defaulted',
              'users':          'account policy must be pinned, not defaulted',
          }
          s = yaml.safe_load(open('/mnt/sq/etc/calamares/settings.conf'))
          seq = []
          for phase in s['sequence']:
              for k, v in phase.items():
                  seq += v
          inst = {(i['module'], i['id']): i.get('config', i['module'] + '.conf')
                  for i in (s.get('instances') or [])}
          shipped = {f for f in os.listdir('/mnt/sq/etc/calamares/modules') if f.endswith('.conf')}
          missing = []
          for entry in seq:
              mod = entry.split('@', 1)[0]
              if mod not in REQUIRES_CONF:
                  continue
              conf = inst.get(tuple(entry.split('@', 1)), mod + '.conf') if '@' in entry else mod + '.conf'
              if conf not in shipped:
                  missing.append((entry, conf, REQUIRES_CONF[mod]))
          for entry, conf, why in missing:
              print(f"MISSING: sequence runs '{entry}' but {conf} is not shipped -> {why}")
          sys.exit(1 if missing else 0)
          PY
          then echo "ok   every config-REQUIRING sequence module ships its conf"
          else echo "FAIL a sequence module that needs a conf has none — install would break"; fail=1
          fi

          [ "$fail" -eq 0 ] || { echo "installer-assembly assertions FAILED" >&2; exit 1; }

      - name: Run the distro CLIs in the real image userland (overlay + chroot)
        run: |
          set -euo pipefail
          # Make the read-only squashfs writable via overlayfs so we can drop the
          # test suite in and run it against the ACTUAL shipped Ubuntu userland.
          mkdir -p up work root
          sudo mount -t overlay overlay -o lowerdir=/mnt/sq,upperdir="$PWD/up",workdir="$PWD/work" "$PWD/root"
          sudo mkdir -p root/opt/testkit
          sudo cp -a tests modes drivers root/opt/testkit/
          for fs in proc sys dev; do sudo mount --bind /$fs "root/$fs"; done
          echo "--- distro-modectl status (in image) ---"
          sudo chroot root /usr/local/bin/distro-modectl status
          echo "--- distro-ai-detect-tier --print (in image, no GPU -> cpu) ---"
          sudo chroot root /usr/local/bin/distro-ai-detect-tier --print | sed 's/\x1b\[[0-9;]*m//g' | grep -E "Tier:|GPU:"
          echo "--- full hermetic test suite on the real image (bash5/GNU) ---"
          # Run the suite as a NON-root uid: distro-ai-setup / 04-download-image-
          # models.sh intentionally refuse to run as root, and sudo chroot is root.
          sudo chroot root setpriv --reuid 1000 --regid 1000 --clear-groups \
            env HOME=/tmp TMPDIR=/tmp bash /opt/testkit/tests/run.sh
          for fs in proc sys dev; do sudo umount "root/$fs" || true; done
          sudo umount root || true

  install:
    # This drives Calamares' GUI over VNC. It used to be `continue-on-error: true`
    # on the grounds that GUI-driving is inherently fragile in CI — but that
    # traded a flaky red for something worse: a SILENT GREEN. Run 31514253124
    # copied nothing at all (target disk stayed at 200 KB, the step's own
    # assertion printed "FAIL: target disk got <2GB — install did not copy the
    # system"), and the run still reported success because this flag swallowed
    # the job's failure. It is exactly the false-green this file's own comments
    # warn about further down, and it nearly got the install reported as working.
    #
    # The drive is far more deterministic now — Alt+N uses Calamares' real button
    # accelerator instead of hardcoded pixels, every vncdo call is bounded so one
    # bad poke cannot stall the job, and the partition scheme is chosen
    # explicitly. A genuine harness flake should be read and fixed, not hidden.
    # `inspect` remains the deterministic assembly check and runs independently.
    if: ${{ inputs.phase != 'inspect' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve build run + artifact
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN: ${{ inputs.build_run_id }}
          INPUT_ARTIFACT: ${{ inputs.artifact }}
        run: |
          set -euo pipefail
          # Same explicit-artifact resolution as the inspect job — see the comment
          # there. A `refract-os-*` glob would happily hand this job a -noai or
          # DANGER-TESTING-NO-LOGIN image and fail on a phantom defect.
          pick() {  # pick <run-id> -> wanted artifact name, empty if it has none
            local list
            list=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$1/artifacts" \
                     --jq '.artifacts[] | select(.expired | not) | .name') || return 0
            if [ -n "$INPUT_ARTIFACT" ]; then
              printf '%s\n' "$list" | grep -xF -- "$INPUT_ARTIFACT" || true
            else
              printf '%s\n' "$list" | grep -E '^refract-os-[a-z0-9]+$' | head -n1 || true
            fi
          }
          if [ -n "$INPUT_RUN" ]; then
            id="$INPUT_RUN"; art=$(pick "$id")
          else
            id=""; art=""
            for cand in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-iso.yml \
                            --status success --limit 20 --json databaseId -q '.[].databaseId'); do
              art=$(pick "$cand")
              if [ -n "$art" ]; then id="$cand"; break; fi
            done
          fi
          [ -n "$id" ] && [ -n "$art" ] || {
            echo "No build-iso run with a ${INPUT_ARTIFACT:-full refract-os-<strain>} artifact (mode-omitted/testing builds don't count — pass 'artifact' to force one)." >&2
            exit 1; }
          echo "using run $id, artifact $art"
          { echo "id=$id"; echo "artifact=$art"; } >> "$GITHUB_OUTPUT"

      - name: Download ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.run.outputs.artifact }}
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
          path: iso-dl

      - name: Prepare QEMU + vncdotool
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils socat python3-pip
          pipx install vncdotool 2>/dev/null || pip install --user vncdotool
          ISO=$(find iso-dl -name "*.iso" | head -n1); mv "$ISO" refract.iso
          [ -e /dev/kvm ] && sudo chmod 666 /dev/kvm && echo "ACCEL=kvm" >> "$GITHUB_ENV" || echo "ACCEL=tcg" >> "$GITHUB_ENV"
          qemu-img create -f qcow2 target.qcow2 20G

      - name: "Drive Calamares over VNC, install to the blank disk"
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p shots
          qemu-system-x86_64 -accel "$ACCEL" -m 4096 -smp 4 \
            -cdrom refract.iso -boot d \
            -drive file=target.qcow2,format=qcow2,if=virtio \
            -display none -vga std -vnc :0 \
            -monitor unix:mon.sock,server,nowait -pidfile qemu.pid -daemonize
          mon() { printf '%s\n' "$1" | socat - unix-connect:mon.sock >/dev/null; }
          shot() { mon "screendump $PWD/shots/$1.ppm"; }
          # BOUNDED + NON-FATAL. Run 31510234422 proved why: `vd key super-Up`
          # hung, and with no timeout that single call consumed the job's entire
          # 40-minute budget — the step never even reached its own PNG conversion
          # (the uploaded artifact still held .ppm files), and the job died as
          # "cancelled" with no error to read. No single GUI poke may ever be able
          # to eat the budget again; a failed poke should show up as a wrong
          # screenshot, which is diagnosable, not as a silent 40-minute stall.
          vd() { timeout 45 vncdo -s localhost:0 "$@" || echo "WARN: vncdo '$*' failed/timed out" >&2; }

          echo "Waiting for the live desktop (~3.5 min)..."
          sleep 210
          shot 00-desktop
          # Launch Calamares via GNOME search — robust, no pixel-hunting: open the
          # Activities overview (Super), type the app name, Enter. (Recon run
          # 28571437379 confirmed the dock's floppy icon is QEMU's default floppy
          # device, NOT the installer, and no desktop icon renders.)
          vd key super; sleep 3; shot 01a-overview
          vd type "Install Refract"; sleep 3; shot 01b-search
          vd key enter; sleep 25
          shot 01c-after-launch
          # The installer window opens at a NON-deterministic position/size, so
          # fixed button coords miss (a prior run had Next at ~879,570 not 1007,640).
          # Maximize it (GNOME: Super+Up) so the buttons sit at fixed screen-relative
          # spots. CRITICAL: vncdo is stateless per invocation — a separate `move`
          # then `click` reconnects with the cursor reset to (0,0); move+click MUST
          # be ONE vncdo call. Maximized on 1280x800: Next ~ (1155,772).
          # NO MAXIMIZE. `vd key super-Up` does not work here — run 31515575564
          # logged "WARN: vncdo 'key super-Up' failed/timed out" and run
          # 31510234422 hung on it for the full 40-minute budget. Calamares opens
          # at a deterministic centred geometry on this 1280x800 display
          # (window x≈128-1152, y≈124-740, identical across every run), so the
          # coordinates below are taken from that real, observed layout rather
          # than from a maximized window that never materialises.
          shot 01d-window
          # ADVANCE BY KEYBOARD, NOT BY PIXEL. Calamares underlines the N in its
          # "Next" button (visible in run 31510234422's 01c screenshot), so Alt+N
          # is the button's real accelerator and works wherever the window sits —
          # no dependence on the maximize above having worked, and no dependence
          # on a hardcoded 1155,772 that silently misses when the window opens at
          # a different size or position (a prior run had Next at ~879,570).
          next() { vd key alt-n; sleep "${1:-6}"; }
          next 5;  shot 02a-locale       # Welcome  -> Locale
          next 5;  shot 02b-keyboard     # Locale   -> Keyboard
          next 6;  shot 02-partition     # Keyboard -> Partition (scheme CHOICE page)
          # PICK A SCHEME EXPLICITLY. partition.conf sets
          # initialPartitioningChoice: none on purpose, so no radio is
          # preselected and Next stays DISABLED until a human consciously
          # chooses — deliberate, to avoid pre-arming a wipe-the-disk default on
          # a machine that may already have an OS. Run 31514253124 proved the
          # harness never honoured that: the wizard sat on this page with Next
          # greyed out until the fail-fast bail, and stray keystrokes from the
          # Users step later flipped it into the manual partition editor. The
          # comment here used to claim an "erase-disk default" that does not
          # exist. Click "Erase disk" (radio at the top of the choice list), then
          # confirm Next actually became enabled before advancing.
          vd move 324 220 click 1; sleep 2; shot 02c-erase-selected
          next 6;  shot 03-users         # Partition -> Users
          # Users page. Click "Your Full Name" at its REAL coordinate. This was
          # 640,300 — a maximized-window position — while the window is never
          # maximized (see above), so the click landed on dead space, nothing was
          # focused, and every keystroke below went nowhere: run 31515575564
          # reached this page with all four fields still empty and Next disabled.
          #
          # Tab order is Full Name -> login -> Computer Name -> Password ->
          # Repeat Password, so Password is THREE tabs from Full Name, not two.
          # The old two-tab version typed the password into Computer Name.
          # login and Computer Name auto-derive from the full name, so they are
          # tabbed through without typing.
          vd move 417 203 click 1; sleep 1
          vd type "tester"
          vd key tab; vd key tab; vd key tab
          vd type "refractos1"; vd key tab; vd type "refractos1"; sleep 1
          shot 03b-users-filled
          next 6;  shot 04-summary       # Users -> Summary
          # Summary -> Install. 1155,772 was another maximized-window coordinate:
          # on the real centred window that point is OUTSIDE the dialog entirely
          # (its buttons sit at y≈718, rightmost edge x≈1145), so the click hit
          # the desktop behind and the install was never started. The primary
          # button occupies the same slot as "Next" throughout the wizard —
          # 1007,718 in the observed geometry — and reads "Install" here.
          vd move 1007 718 click 1; sleep 3
          shot 04b-confirm
          # An "Install now?" confirm dialog may pop — its OK is also bottom-right.
          vd key tab; sleep 1; vd key enter
          echo "Installing (unpackfs copy + grub)... polling target disk growth"
          # An erase-disk install writes several GB; poll qcow2 actual size as a
          # progress proxy, up to 25 minutes.
          prev=0
          for i in $(seq 1 50); do
            sleep 30
            sz=$(qemu-img info -U --output=json target.qcow2 | python3 -c "import json,sys;print(json.load(sys.stdin)['actual-size'])")
            # Fail fast: if the disk is still ~empty after ~4 min, the GUI-drive
            # never reached the copy step — bail instead of polling 25 min + then
            # 10 min booting an empty disk (that combo hit the 60-min job timeout).
            if [ "$i" -ge 8 ] && [ "$sz" -lt 5000000 ]; then
              echo "install did not start (VNC GUI-drive didn't reach unpackfs) — bailing; see docs/utm-guide.md for a human install."; break
            fi
            echo "target actual-size: $sz"
            [ "$i" -eq 10 ] && shot 05-installing
            if [ "$sz" -gt 2000000000 ] && [ "$sz" -eq "$prev" ]; then echo "size stabilized >2GB — install likely done"; break; fi
            prev="$sz"
          done
          shot 06-final
          mon "quit" || true
          sudo apt-get install -y imagemagick >/dev/null 2>&1 || true
          for f in shots/*.ppm; do convert "$f" "${f%.ppm}.png" 2>/dev/null && rm -f "$f" || true; done
          # Sanity: the target must have received real data.
          final=$(qemu-img info -U --output=json target.qcow2 | python3 -c "import json,sys;print(json.load(sys.stdin)['actual-size'])")
          echo "final target actual-size: $final"
          [ "$final" -gt 2000000000 ] || { echo "FAIL: target disk got <2GB — install did not copy the system." >&2; exit 1; }

      - name: "Give the installed disk a serial console (test harness only)"
        run: |
          set -euo pipefail
          # WHY THIS STEP HAD TO BE ADDED.
          # The step below boots target.qcow2 with `-serial file:installed-serial.log`
          # and greps that log for a userspace marker. But the INSTALLED system boots
          # through its OWN GRUB, whose cmdline comes from /etc/default/grub —
          # "quiet splash", with no console= at all. Nothing was ever written to
          # ttyS0, so installed-serial.log was EMPTY on every run and the grep could
          # never match. The assertion could only ever take its failure branch, which
          # `continue-on-error` then swallowed into a green run: it has never once
          # verified an install in either direction.
          #
          # Putting console= in the SHIPPED image would be wrong — users would get
          # kernel spew aimed at a serial port they do not have — so the console is
          # added HERE, to the throwaway test artifact, immediately before the test
          # boot. Whether a system boots does not depend on which console it logs to.
          cleanup() {
            sudo umount /mnt/installed 2>/dev/null || true
            sudo qemu-nbd --disconnect /dev/nbd0 >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          # max_part matters: if the nbd module is already loaded WITHOUT it, the
          # kernel creates no /dev/nbd0pN nodes and every check below would blame
          # a missing filesystem for what is really a module-parameter problem.
          sudo modprobe nbd max_part=16 || true
          sudo qemu-nbd --connect=/dev/nbd0 target.qcow2
          # Partition nodes appear asynchronously after connect.
          sudo partprobe /dev/nbd0 >/dev/null 2>&1 || true
          for _ in $(seq 1 20); do [ -e /dev/nbd0p1 ] && break; sleep 1; done
          lsblk -o NAME,SIZE,FSTYPE,PARTTYPENAME /dev/nbd0 || true
          if [ ! -e /dev/nbd0p1 ]; then
            echo "FAIL: no partition nodes under /dev/nbd0 after connect+settle." >&2
            echo "Either the installer never partitioned the disk, or the nbd module was already loaded without max_part (check 'cat /sys/module/nbd/parameters/max_part')." >&2
            cat /sys/module/nbd/parameters/max_part 2>/dev/null || true
            exit 1
          fi
          # Root is the largest LINUX filesystem partition — the ESP is vfat and
          # swap is swap. Parsed with -P (KEY="value" pairs) rather than columnar
          # output: with `lsblk -r`, an empty field collapses under awk's default
          # splitting and shifts every later column, which is exactly the kind of
          # thing that silently picks the wrong partition. defaultFileSystemType in
          # partition.conf is ext4, but accept the other rootable types it offers
          # so changing that setting doesn't quietly break this assertion.
          root_part=$(lsblk -bPo NAME,FSTYPE,SIZE /dev/nbd0 | awk '
            { fs=""; sz=0; nm=""
              if (match($0, /FSTYPE="[^"]*"/)) { fs=substr($0, RSTART+8, RLENGTH-9) }
              if (match($0, /SIZE="[^"]*"/))   { sz=substr($0, RSTART+6, RLENGTH-7) + 0 }
              if (match($0, /NAME="[^"]*"/))   { nm=substr($0, RSTART+6, RLENGTH-7) }
              if (fs=="ext4" || fs=="btrfs" || fs=="xfs" || fs=="f2fs") { print sz" /dev/"nm }
            }' | sort -rn | head -n1 | awk '{print $2}')
          if [ -z "$root_part" ]; then
            echo "FAIL: the installed disk has no Linux root filesystem (looked for ext4/btrfs/xfs/f2fs)." >&2
            echo "The partition and/or unpackfs steps never produced a root filesystem — the GUI-driven install did not complete." >&2
            exit 1
          fi
          echo "installed root filesystem: $root_part"
          sudo mkdir -p /mnt/installed
          sudo mount "$root_part" /mnt/installed
          # Two things worth asserting while the target is mounted, both of which
          # fail EARLIER and far more legibly than a silent no-boot would.
          [ -f /mnt/installed/boot/grub/grub.cfg ] \
            || { echo "FAIL: installed root has no /boot/grub/grub.cfg — the bootloader module never ran." >&2; exit 1; }
          grep -q 'Refract' /mnt/installed/etc/os-release \
            || { echo "FAIL: the installed /etc/os-release is not Refract — unpackfs copied the wrong tree." >&2; exit 1; }
          sed -n '1,3p' /mnt/installed/etc/os-release
          # Append the console to every kernel line, and drop quiet/splash: with
          # `quiet` in place systemd prints no target lines at all, so even a perfect
          # boot would log nothing for the next step to match on.
          sudo sed -i -E 's|^([[:space:]]*linux[[:space:]].*)$|\1 console=ttyS0,115200|; s|[[:space:]]+quiet\b||g; s|[[:space:]]+splash\b||g' \
            /mnt/installed/boot/grub/grub.cfg
          echo "=== patched kernel lines ==="
          grep -E '^[[:space:]]*linux[[:space:]]' /mnt/installed/boot/grub/grub.cfg | head -n5

      - name: "Boot the INSTALLED disk (no ISO) and assert userspace"
        run: |
          set -euo pipefail
          timeout 600 qemu-system-x86_64 -accel "$ACCEL" -m 4096 -smp 4 \
            -drive file=target.qcow2,format=qcow2,if=virtio \
            -display none -serial "file:$PWD/installed-serial.log" \
            -pidfile "$PWD/qemu2.pid" -daemonize
          # LATE markers only: a bare "reached target" fires for Swap / Local File
          # Systems on any half-booted system. `\bgdm3?\b` and a bare `login:` were
          # in this alternation and are gone — the first matches "Failed to start
          # GNOME Display Manager" and "gdm3.service: Main process exited" as
          # readily as a successful start, the second matches "pam_unix(login:
          # session):" anywhere mid-log. See the same fix in boot-smoke.yml.
          GRAPHICAL='reached target graphical|started (gnome display manager|gdm)'
          CONSOLE='^[[:alnum:]_.-]+ login:'
          DM_FAIL='failed to start (gnome display manager|gdm)|gdm3?\.service: (main process exited|failed with result)|dependency failed for .*display manager'
          ok=""
          for i in $(seq 1 80); do
            sleep 5
            grep -qiE "$GRAPHICAL" installed-serial.log 2>/dev/null && { ok=graphical; break; }
          done
          # Headless strains never reach graphical.target; an anchored getty prompt
          # is their proof of userspace. Checked after the loop, not inside it: on a
          # desktop the getty prompt often lands before gdm and would break early.
          if [ -z "$ok" ] && grep -qE "$CONSOLE" installed-serial.log 2>/dev/null; then ok=console; fi
          if grep -qiE "$DM_FAIL" installed-serial.log 2>/dev/null; then
            if [ "$ok" = graphical ]; then
              echo "NOTE: a display-manager failure was logged but graphical.target was still reached — see the serial log."
            else
              echo "display manager failed to start on the installed disk:"; grep -iE "$DM_FAIL" installed-serial.log | head -n5
              ok=""
            fi
          fi
          kill "$(cat qemu2.pid)" 2>/dev/null || true
          echo "=== installed-disk serial tail ==="; tail -40 installed-serial.log || true
          if [ -n "$ok" ]; then
            if [ "$ok" = graphical ]; then
              echo "PASS: the installed disk reaches the graphical target with no ISO attached."
              echo "INSTALL VERIFY PASSED: installed disk reached the graphical target with no ISO attached." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "PASS (console): the installed disk reaches a console login prompt with no ISO attached; this image has no graphical target."
              echo "INSTALL VERIFY PASSED (console): installed disk reached a getty login prompt with no ISO attached." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            # continue-on-error has been REMOVED from this job, so this exit now
            # genuinely red-Xes the run instead of being swallowed into a green
            # check. The step summary stays: it names the failure precisely on the
            # run's front page, which is faster to read than the serial tail.
            echo "FAIL: installed disk did not reach the graphical target / a display manager / login prompt — grub/unpackfs/fstab problem." >&2
            {
              echo "## ⚠️ INSTALL VERIFY FAILED"
              echo "The installed disk booted but never reached the graphical target, a display manager, or a login prompt."
              echo "See the installed-disk serial tail in the step log and the \`install-smoke-evidence\` artifact."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Upload install evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-smoke-evidence
          path: |
            shots/
            installed-serial.log
          if-no-files-found: warn
          retention-days: 14
