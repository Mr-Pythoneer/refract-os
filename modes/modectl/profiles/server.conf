# Server mode profile — sourced by distro-modectl.
MODE_NAME="Server"
CPU_GOVERNOR="powersave"
POWER_PROFILE="power-saver"
ENABLE_SERVICES=(ssh docker netdata)
DISABLE_SERVICES=(gdm)
STOP_AI_MODEL=true
CONFIRM_DISPLAY_MANAGER_STOP=true
GPU_PERF=auto
PINNED_APPS=()
NOTES="Disabling gdm drops the box to a text console on next boot/restart. distro-modectl asks for explicit confirmation before doing this — see DESIGN.md, Server mode is meant to be usable headless but shouldn't kill an active desktop session without the user saying so."
# Per-mode desktop look (distro-modectl apply_theme): wallpaper.
WALLPAPER="/usr/share/backgrounds/refract/server.png"
# Per-mode UI accent (distro-modectl apply_theme writes it into the GTK
# accent overrides). This is the mode's ray from the prism mark, the same
# value the wallpaper emphasises and the website's mode card uses. Before
# this, EVERY mode rendered identical UI chrome and only the wallpaper
# changed, so "switches its whole personality" was invisible in the shell.
ACCENT="#7bc043"   # green
# Liquid glass (frosted blur) is OFF for this mode — real-time blur is GPU-heavy.
LIQUID_GLASS=false
