# Normal mode profile — sourced by distro-modectl.
MODE_NAME="Normal"
CPU_GOVERNOR="schedutil"
POWER_PROFILE="balanced"
ENABLE_SERVICES=()
DISABLE_SERVICES=()
STOP_AI_MODEL=true
CONFIRM_DISPLAY_MANAGER_STOP=false
GPU_PERF=auto
PINNED_APPS=()
NOTES="The macOS look (WhiteSur + bottom dock) is baked into the image as the default; this switch re-asserts it, restores the Normal wallpaper, turns liquid-glass blur ON, and applies the balanced CPU/power profile + stops any running AI model. The modes/normal/setup/*.sh scripts remain for installed systems / manual re-apply. See modes/normal/README.md."
# Per-mode desktop look (distro-modectl apply_theme): wallpaper + macOS (WhiteSur)
# theme kept consistent across modes.
WALLPAPER="/usr/share/backgrounds/refract/normal.png"
# Per-mode UI accent (distro-modectl apply_theme writes it into the GTK accent
# overrides). This is the mode's ray from the prism mark, the same value the
# wallpaper emphasises and the website's mode card uses. Before this, EVERY mode
# rendered identical UI chrome and only the wallpaper changed, so "switches its
# whole personality" was invisible in the shell.
# Replaces the dead YARU_ACCENT="" that sat here: it was the last survivor of a
# Yaru-accent scheme this distro no longer uses (the other four profiles had
# theirs removed already), and keeping a second, non-functioning accent variable
# next to the real one is exactly how someone sets the wrong one later.
ACCENT="#ffa23d"   # orange
# Liquid glass (frosted-blur macOS look) — ON for Normal only; every other mode
# turns it off so the compositor spends zero GPU on blur.
LIQUID_GLASS=true
