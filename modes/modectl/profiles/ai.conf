# AI mode profile — sourced by distro-modectl.
MODE_NAME="AI"
# PERFORMANCE, not balanced. Local inference is the most compute-hungry thing
# this distro does and it was the only heavy mode left running on the balanced
# profile: Gaming and Creative both pin performance, and AI — which saturates
# every core during prompt processing and holds a GPU at full tilt for the whole
# generation — was asking the scheduler to ramp up politely. On an Intel laptop
# that means EPP stays on balance_power and the package sits well below its
# sustained power limit while a model is decoding, which is measurable as
# tokens/sec left on the table for no benefit; nothing about AI mode is a
# background task the user is waiting out.
CPU_GOVERNOR="performance"
POWER_PROFILE="performance"
ENABLE_SERVICES=()
DISABLE_SERVICES=()
STOP_AI_MODEL=false
AI_AUTOSTART_USECASE="coding"
CONFIRM_DISPLAY_MANAGER_STOP=false
# max, for the same reason: an LLM is GPU-bound end to end, and leaving the card
# adaptive lets it clock down between token batches.
GPU_PERF=max
PINNED_APPS=()
NOTES="Auto-detects the hardware tier on first entry (distro-ai-detect-tier), then loads the Ollama model for use-case \$AI_AUTOSTART_USECASE (default: coding) via distro-ai-model and ensures the ollama service is up on :11434. Requires modes/ai/setup/ (or distro-ai-setup --install) to have installed Ollama + pulled models. Change AI_AUTOSTART_USECASE to any use-case in distro-ai-model's use-case table (the source of truth — the per-tier models.catalog.<tier>.json files are superseded LM Studio catalogs): coding/cad/day-to-day/know-it-all/uncensored/assistant/vision."
# Per-mode desktop look (distro-modectl apply_theme): wallpaper.
WALLPAPER="/usr/share/backgrounds/refract/ai.png"
# Per-mode UI accent (distro-modectl apply_theme writes it into the GTK
# accent overrides). This is the mode's ray from the prism mark, the same
# value the wallpaper emphasises and the website's mode card uses. Before
# this, EVERY mode rendered identical UI chrome and only the wallpaper
# changed, so "switches its whole personality" was invisible in the shell.
ACCENT="#4a9df0"   # blue
# Foreground drawn ON the accent (selection text, switch labels).
# MEASURED, not assumed: white on this accent is only 2.85:1, below
# even the 3:1 floor for UI components; #1a1a1a gives 6.11:1. Every one of
# the five mode accents is a mid-to-light hue, so all five want dark text —
# the switcher used to hardcode #ffffff for all of them.
ACCENT_FG="#1a1a1a"
# Liquid glass (frosted blur) is OFF for this mode — real-time blur is GPU-heavy.
LIQUID_GLASS=false
