# Gaming mode profile — sourced by distro-modectl.
MODE_NAME="Gaming"
CPU_GOVERNOR="performance"
POWER_PROFILE="performance"
ENABLE_SERVICES=()
DISABLE_SERVICES=()
STOP_AI_MODEL=true
CONFIRM_DISPLAY_MANAGER_STOP=false
GPU_PERF=max
PINNED_APPS=(steam.desktop net.lutris.Lutris.desktop com.usebottles.bottles.desktop)
NOTES="GameMode is invoked per-launch by Steam/Lutris (gamemoderun), not run as a system service — nothing to enable here. PINNED_APPS desktop-file IDs web-verified (2026-06): steam-installer ships steam.desktop; Lutris uses reverse-DNS net.lutris.Lutris.desktop (old lutris.desktop is legacy); Bottles' Flatpak exports com.usebottles.bottles.desktop. GPU_PERF=max pins the Nvidia GPU to max performance (best-effort, see distro-modectl apply_gpu_perf)."
# Per-mode desktop look (distro-modectl apply_theme): wallpaper.
WALLPAPER="/usr/share/backgrounds/refract/gaming.png"
# Per-mode UI accent (distro-modectl apply_theme writes it into the GTK
# accent overrides). This is the mode's ray from the prism mark, the same
# value the wallpaper emphasises and the website's mode card uses. Before
# this, EVERY mode rendered identical UI chrome and only the wallpaper
# changed, so "switches its whole personality" was invisible in the shell.
ACCENT="#ff5a52"   # red    — least deviated ray
# Foreground drawn ON the accent (selection text, switch labels).
# MEASURED, not assumed: white on this accent is only 3.07:1, below
# even the 3:1 floor for UI components; #1a1a1a gives 5.67:1. Every one of
# the five mode accents is a mid-to-light hue, so all five want dark text —
# the switcher used to hardcode #ffffff for all of them.
ACCENT_FG="#1a1a1a"
# Liquid glass (frosted blur) is OFF for this mode — real-time blur is GPU-heavy.
LIQUID_GLASS=false
