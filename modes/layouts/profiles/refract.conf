# Refract — the default. Its OWN identity, not an imitation of anything.
#
# WHY ADWAITA AND NOT A CUSTOM GTK THEME. This is the whole point of the layout
# split. GTK4/libadwaita apps — Settings, Files, Text Editor, Disks, most of
# GNOME 46 — deliberately ignore GTK themes. Any custom theme therefore styles
# half the desktop and loses the other half, which is exactly the mismatched
# window-control bug that prompted this rework. Adwaita-dark IS what libadwaita
# renders natively, so every app agrees with no theming tax and nothing to
# re-fix on each GNOME release.
#
# The identity comes from things the toolkit does not fight: the prism accent
# (apply_accent writes it as GTK CSS, and it is the mode's own colour), the
# generated prism wallpapers, and the frosted glass. That is a look nobody else
# ships, without pretending to be another OS.
LAYOUT_NAME="Refract"
LAYOUT_DESC="Refract's own look — liquid glass, prism accents, left dock."
GTK_THEME="Adwaita-dark"
ICON_THEME="Papirus-Dark"
SHELL_THEME=""
DOCK_POSITION="LEFT"
DOCK_EXTENDED=false
DOCK_FLOATING=true
# GNOME-native control placement: right-hand side, no appmenu button.
BUTTON_LAYOUT="appmenu:minimize,maximize,close"
LIQUID_GLASS=true
