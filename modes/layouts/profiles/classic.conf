# Classic — for people arriving from Windows.
#
# Bottom taskbar spanning the full width, app grid at the left where a Start
# button sits, window controls on the right. No glass by default: the audience
# for this layout skews toward older or lower-powered hardware, and real-time
# blur is GPU-expensive. Same Adwaita base as Refract, so no theming tax here
# either.
LAYOUT_NAME="Classic"
LAYOUT_DESC="Familiar taskbar layout — bottom panel, app grid on the left."
GTK_THEME="Adwaita-dark"
ICON_THEME="Papirus-Dark"
SHELL_THEME=""
DOCK_POSITION="BOTTOM"
DOCK_EXTENDED=true
DOCK_FLOATING=false
BUTTON_LAYOUT="appmenu:minimize,maximize,close"
LIQUID_GLASS=false
