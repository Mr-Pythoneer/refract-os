# Minimal — stock GNOME, nothing added.
#
# No dock extension, no blur, no shell theme. This is the fastest option and the
# right default for the lowspec strain and older hardware: every extension is
# JavaScript running inside the compositor process, so the fewer the better for
# both performance and stability.
LAYOUT_NAME="Minimal"
LAYOUT_DESC="Stock GNOME — no dock, no blur, fastest and lightest."
GTK_THEME="Adwaita-dark"
ICON_THEME="Adwaita"
SHELL_THEME=""
DOCK_POSITION="OFF"
DOCK_EXTENDED=false
DOCK_FLOATING=false
BUTTON_LAYOUT="appmenu:minimize,maximize,close"
LIQUID_GLASS=false
