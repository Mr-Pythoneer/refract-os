# macOS — opt-in, no longer the default.
#
# This is the look the distro shipped before layouts existed. It is kept because
# people genuinely like it, but it is NOT the default any more, for a reason
# worth recording: it is the only layout with an ongoing maintenance cost.
# MacTahoe is a GTK3 theme plus a gtk-4.0 config bolted on to reach libadwaita
# apps, and that bolt-on is upstream's workaround for a toolkit that is actively
# moving away from theming. Every GNOME release can break it. The other three
# layouts use what libadwaita renders natively and cannot break that way.
LAYOUT_NAME="macOS"
LAYOUT_DESC="Bottom dock, traffic-light window controls, MacTahoe theme."
GTK_THEME="MacTahoe-Dark"
ICON_THEME="MacTahoe-dark"
SHELL_THEME="MacTahoe-Dark"
DOCK_POSITION="BOTTOM"
DOCK_EXTENDED=false
DOCK_FLOATING=true
# Controls on the LEFT, in macOS order. The trailing colon is what puts them
# there — everything before it is left-aligned, everything after is right.
BUTTON_LAYOUT="close,minimize,maximize:"
LIQUID_GLASS=true
