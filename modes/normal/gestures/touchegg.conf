<!--
  Refract OS — trackpad gestures for the X11 session.

  WHY THIS FILE EXISTS AT ALL. GNOME 46 has excellent multi-touch gestures built
  in — three fingers to switch workspace, three up for the overview — and they
  are Wayland-only. Refract forces the Xorg session on Intel graphics
  (hooks/0400-polish.chroot) to dodge a Wayland modeset hang that has bricked
  boots on real Intel iGPU/panel combos, and that hook's own comment lists
  "gestures" among the things the workaround costs. So on the exact hardware this
  distro was built for, a laptop with a perfectly good trackpad had no gestures
  at all — not because anything was broken, but because the fix for one problem
  quietly removed a feature and nothing replaced it.

  touchegg replaces it. It reads libinput directly and synthesises the keystrokes
  GNOME already binds, so these are the SAME actions the Wayland gestures
  perform — not a parallel system with its own ideas.

  THE BINDINGS ARE GNOME'S OWN DEFAULTS, deliberately. Super opens the overview,
  Super+A the app grid, Super+Page_Up/Down move between workspaces. Inventing new
  shortcuts here would mean gestures and the keyboard disagreeing about what the
  machine does, and would break the moment somebody rebinds something in
  Settings.

  DIRECTION IS macOS-NATURAL, matching the rest of the desktop: swiping left
  moves you RIGHT through workspaces, the way pushing a sheet of paper does.
-->
<touchégg>

  <settings>
    <!-- How far a gesture must travel before it counts. The default is tuned for
         large trackpads; a ThinkPad's is smaller, and a threshold meant for a
         MacBook makes every gesture feel like it needs a run-up. -->
    <property name="animation_delay">150</property>
    <property name="action_execute_threshold">20</property>
  </settings>

  <application name="All">

    <!-- THREE FINGERS: where you are. -->
    <gesture type="SWIPE" fingers="3" direction="UP">
      <action type="SEND_KEYS">
        <repeat>false</repeat>
        <modifiers>Super_L</modifiers>
        <keys></keys>
        <on>begin</on>
      </action>
    </gesture>

    <!-- Down closes the overview again: the same key toggles it, so this is one
         gesture and its inverse rather than two unrelated ones. -->
    <gesture type="SWIPE" fingers="3" direction="DOWN">
      <action type="SEND_KEYS">
        <repeat>false</repeat>
        <modifiers>Super_L</modifiers>
        <keys></keys>
        <on>begin</on>
      </action>
    </gesture>

    <gesture type="SWIPE" fingers="3" direction="LEFT">
      <action type="SEND_KEYS">
        <repeat>false</repeat>
        <modifiers>Super_L+Control_L</modifiers>
        <keys>Right</keys>
        <on>begin</on>
      </action>
    </gesture>

    <gesture type="SWIPE" fingers="3" direction="RIGHT">
      <action type="SEND_KEYS">
        <repeat>false</repeat>
        <modifiers>Super_L+Control_L</modifiers>
        <keys>Left</keys>
        <on>begin</on>
      </action>
    </gesture>

    <!-- FOUR FINGERS: everything you have. -->
    <gesture type="SWIPE" fingers="4" direction="UP">
      <action type="SEND_KEYS">
        <repeat>false</repeat>
        <modifiers>Super_L</modifiers>
        <keys>A</keys>
        <on>begin</on>
      </action>
    </gesture>

    <!-- Show the desktop. Not bound by default in GNOME 46, so this is a no-op
         until somebody binds it — which is better than picking a shortcut that
         already means something else. -->
    <gesture type="SWIPE" fingers="4" direction="DOWN">
      <action type="SEND_KEYS">
        <repeat>false</repeat>
        <modifiers>Super_L+Control_L</modifiers>
        <keys>D</keys>
        <on>begin</on>
      </action>
    </gesture>

    <!-- PINCH: the overview, the way it works on a phone. Pinching in shows you
         everything; spreading out returns you to the window you were in. -->
    <gesture type="PINCH" fingers="4" direction="IN">
      <action type="SEND_KEYS">
        <repeat>false</repeat>
        <modifiers>Super_L</modifiers>
        <keys></keys>
        <on>begin</on>
      </action>
    </gesture>

    <gesture type="PINCH" fingers="4" direction="OUT">
      <action type="SEND_KEYS">
        <repeat>false</repeat>
        <modifiers>Super_L</modifiers>
        <keys></keys>
        <on>begin</on>
      </action>
    </gesture>

  </application>

  <!-- TWO FINGERS, IN BROWSERS ONLY: back and forward.
       Scoped to browsers on purpose. Two-finger horizontal movement is SCROLLING
       everywhere else — binding it globally would make every sideways scroll in a
       spreadsheet or a code editor navigate away from what you were doing, which
       is the single most annoying thing a gesture daemon can be configured to
       do. Browsers are where the gesture already means "back" to everyone. -->
  <application name="google-chrome,Google-chrome,chromium,Chromium,firefox,Firefox,Navigator">
    <gesture type="SWIPE" fingers="2" direction="RIGHT">
      <action type="SEND_KEYS">
        <repeat>false</repeat>
        <modifiers>Alt_L</modifiers>
        <keys>Left</keys>
        <on>begin</on>
      </action>
    </gesture>
    <gesture type="SWIPE" fingers="2" direction="LEFT">
      <action type="SEND_KEYS">
        <repeat>false</repeat>
        <modifiers>Alt_L</modifiers>
        <keys>Right</keys>
        <on>begin</on>
      </action>
    </gesture>
  </application>

</touchégg>
